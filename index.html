<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ STREET FOOTBALL LEGENDS</title>
    <style>
        /* ... ВЕСЬ CSS ТОТ ЖЕ, ЧТО В ПРЕДЫДУЩЕЙ ВЕРСИИ ... */

    </style>
</head>
<body>

    <!-- ВЕСЬ HTML ТОТ ЖЕ, ЧТО В ПРЕДЫДУЩЕЙ ВЕРСИИ -->
    <!-- (скопируй HTML из предыдущего сообщения, он рабочий) -->

    <script>
        // ============================================================
        // ==================== ВСЯ ИГРА ===============================
        // ============================================================

        // ---- КОНСТАНТЫ ----
        const FIELD_W = 1200,
            FIELD_H = 700;
        const PLAYER_RADIUS = 18;
        const BALL_RADIUS = 10;
        const GOAL_WIDTH = 30;
        const GOAL_HEIGHT = 180;
        const MATCH_TIME = 300;
        const PLAYER_SPEED = 2.2;
        const BOT_SPEED_BASE = 1.8;

        // ---- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ----
        let canvas, ctx;
        let gameState = 'menu';
        let mode = '2x2';
        let difficulty = 'easy';
        let playerName = '';
        let playerRating = 50;
        let playerCrystals = 100;
        let playerWins = 0,
            playerMatches = 0,
            playerGoals = 0;
        let lobbyMode = '1x1';

        let equippedSkins = { 1: 'Повязка', 2: 'Майка', 3: 'Шорты', 4: 'Кеды', 5: 'Нарукавник' };
        let ownedSkins = {};

        // ---- ОНЛАЙН ----
        let currentLobby = null;
        let isInLobby = false;
        let isHost = false;
        let onlineMatchStarted = false;
        let isOnline = false;
        let opponentName = '';
        let lobbyPlayers = [];
        let syncInterval = null;
        let gameStarted = false;

        // ---- API ----
        const SERVER_URL = 'https://machcup-mobile-server.onrender.com';

        async function apiCall(endpoint, data) {
            try {
                const res = await fetch(SERVER_URL + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return await res.json();
            } catch (e) {
                console.log('API Error:', e);
                return { error: 'Ошибка соединения с сервером' };
            }
        }

        async function apiGet(endpoint) {
            try {
                const res = await fetch(SERVER_URL + endpoint);
                return await res.json();
            } catch (e) {
                console.log('API Error:', e);
                return { error: 'Ошибка соединения с сервером' };
            }
        }

        // ---- СКИНЫ ----
        const SKIN_DATA = {
            'Повязка': { slot: 1, rarity: 'common', rating: 0 },
            'Бандана': { slot: 1, rarity: 'uncommon', rating: 1 },
            'Шлем': { slot: 1, rarity: 'rare', rating: 2 },
            'Корона': { slot: 1, rarity: 'epic', rating: 5 },
            'Золотой шлем': { slot: 1, rarity: 'legendary', rating: 8 },
            'Нимб бога': { slot: 1, rarity: 'mythic', rating: 10 },
            'Майка': { slot: 2, rarity: 'common', rating: 0 },
            'Футболка': { slot: 2, rarity: 'uncommon', rating: 1 },
            'Броня': { slot: 2, rarity: 'rare', rating: 2 },
            'Латы': { slot: 2, rarity: 'epic', rating: 5 },
            'Золотая броня': { slot: 2, rarity: 'legendary', rating: 8 },
            'Доспехи бога': { slot: 2, rarity: 'mythic', rating: 10 },
            'Шорты': { slot: 3, rarity: 'common', rating: 0 },
            'Наголенники': { slot: 3, rarity: 'uncommon', rating: 1 },
            'Щитки': { slot: 3, rarity: 'rare', rating: 2 },
            'Поножи': { slot: 3, rarity: 'epic', rating: 5 },
            'Золотые поножи': { slot: 3, rarity: 'legendary', rating: 8 },
            'Ноги бога': { slot: 3, rarity: 'mythic', rating: 10 },
            'Кеды': { slot: 4, rarity: 'common', rating: 0 },
            'Кроссовки': { slot: 4, rarity: 'uncommon', rating: 1 },
            'Бутсы': { slot: 4, rarity: 'rare', rating: 2 },
            'Молнии': { slot: 4, rarity: 'epic', rating: 5 },
            'Золотые бутсы': { slot: 4, rarity: 'legendary', rating: 8 },
            'Ботинки бога': { slot: 4, rarity: 'mythic', rating: 10 },
            'Нарукавник': { slot: 5, rarity: 'common', rating: 0 },
            'Перчатки': { slot: 5, rarity: 'uncommon', rating: 1 },
            'Напульсник': { slot: 5, rarity: 'rare', rating: 2 },
            'Амулет': { slot: 5, rarity: 'epic', rating: 4 },
            'Золотой амулет': { slot: 5, rarity: 'legendary', rating: 7 },
            'Артефакт бога': { slot: 5, rarity: 'mythic', rating: 9 }
        };

        const RARITY_NAMES = {
            common: '🟤 Обычный',
            uncommon: '🟢 Необычный',
            rare: '🔵 Редкий',
            epic: '🟣 Эпический',
            legendary: '🟠 Легендарный',
            mythic: '🔴 Мифический'
        };

        const PACK_PRICES = { common: 100, rare: 300, epic: 800, legendary: 2000 };
        const PACK_DROPS = {
            common: { common: 60, uncommon: 30, rare: 10 },
            rare: { uncommon: 40, rare: 35, epic: 25 },
            epic: { rare: 30, epic: 45, legendary: 25 },
            legendary: { epic: 30, legendary: 50, mythic: 20 }
        };
        const PACK_NAMES = {
            common: '🟤 Обычный пак',
            rare: '🔵 Редкий пак',
            epic: '🟣 Эпический пак',
            legendary: '🟠 Легендарный пак'
        };

        // ---- ПАКИ ----
        function openPack(packType) {
            if (playerCrystals < PACK_PRICES[packType]) {
                showMessage('❌ Недостаточно кристаллов! Нужно ' + PACK_PRICES[packType] + '💎');
                return;
            }
            playerCrystals -= PACK_PRICES[packType];

            const drops = PACK_DROPS[packType];
            let total = 0;
            for (let k in drops) total += drops[k];
            let r = Math.random() * total;
            let rarity = 'common';
            for (let k in drops) {
                r -= drops[k];
                if (r <= 0) { rarity = k; break; }
            }

            const skinsByRarity = {
                common: ['Повязка', 'Майка', 'Шорты', 'Кеды', 'Нарукавник'],
                uncommon: ['Бандана', 'Футболка', 'Наголенники', 'Кроссовки', 'Перчатки'],
                rare: ['Шлем', 'Броня', 'Щитки', 'Бутсы', 'Напульсник'],
                epic: ['Корона', 'Латы', 'Поножи', 'Молнии', 'Амулет'],
                legendary: ['Золотой шлем', 'Золотая броня', 'Золотые поножи', 'Золотые бутсы', 'Золотой амулет'],
                mythic: ['Нимб бога', 'Доспехи бога', 'Ноги бога', 'Ботинки бога', 'Артефакт бога']
            };
            const skinName = skinsByRarity[rarity][Math.floor(Math.random() * skinsByRarity[rarity].length)];

            if (!ownedSkins[skinName]) ownedSkins[skinName] = 0;
            ownedSkins[skinName]++;

            saveGame();
            recalcRating();

            const ratingGain = SKIN_DATA[skinName] ? SKIN_DATA[skinName].rating : 0;
            showMessage('🎉 Выпал: ' + RARITY_NAMES[rarity] + ' - ' + skinName + '! ⭐+' + ratingGain);
            updateUI();
            if (document.getElementById('packs-overlay').style.display === 'flex') {
                renderPacksUI();
            }
        }

        function equipSkinFromUI(skinName) {
            if (!ownedSkins[skinName]) {
                showMessage('❌ У вас нет этого скина!');
                return;
            }
            const slot = SKIN_DATA[skinName].slot;
            for (let s in equippedSkins) {
                if (equippedSkins[s] === skinName) {
                    delete equippedSkins[s];
                }
            }
            equippedSkins[slot] = skinName;
            saveGame();
            recalcRating();
            showMessage('✅ ' + skinName + ' надет! ⭐+' + SKIN_DATA[skinName].rating);
            renderInventoryUI();
        }

        function removeSkinFromSlot(slot) {
            if (equippedSkins[slot]) {
                const name = equippedSkins[slot];
                delete equippedSkins[slot];
                saveGame();
                recalcRating();
                showMessage('❌ ' + name + ' снят');
                renderInventoryUI();
            }
        }

        // ---- ФУНКЦИИ ----
        function recalcRating() {
            let rating = 50;
            for (let slot = 1; slot <= 5; slot++) {
                const skinName = equippedSkins[slot];
                if (skinName && SKIN_DATA[skinName]) {
                    rating += SKIN_DATA[skinName].rating;
                }
            }
            playerRating = Math.min(rating, 99);
            updateUI();
            saveGame();
        }

        function loadSave() {
            try {
                const data = localStorage.getItem('football_save');
                if (data) {
                    const save = JSON.parse(data);
                    playerName = save.name || '';
                    playerRating = save.rating || 50;
                    playerCrystals = save.crystals || 100;
                    playerWins = save.wins || 0;
                    playerMatches = save.matches || 0;
                    playerGoals = save.goals || 0;
                    equippedSkins = save.equippedSkins || { 1: 'Повязка', 2: 'Майка', 3: 'Шорты', 4: 'Кеды', 5: 'Нарукавник' };
                    ownedSkins = save.ownedSkins || {};
                    recalcRating();
                }
            } catch (e) { console.log('Ошибка загрузки', e); }
        }

        function saveGame() {
            try {
                const data = {
                    name: playerName,
                    rating: playerRating,
                    crystals: playerCrystals,
                    wins: playerWins,
                    matches: playerMatches,
                    goals: playerGoals,
                    equippedSkins: equippedSkins,
                    ownedSkins: ownedSkins
                };
                localStorage.setItem('football_save', JSON.stringify(data));
            } catch (e) { console.log('Ошибка сохранения', e); }
        }

        // ---- UI ----
        function updateUI() {
            const info = document.getElementById('playerInfo');
            if (playerName) {
                info.textContent = '👤 ' + playerName + ' | ⭐ ' + playerRating + ' | 💎 ' + playerCrystals;
                document.getElementById('guestMenu').style.display = 'none';
                document.getElementById('userMenu').style.display = 'block';
            } else {
                info.textContent = '👤 Гость | ⭐ 50 | 💎 100';
                document.getElementById('guestMenu').style.display = 'block';
                document.getElementById('userMenu').style.display = 'none';
            }
            document.getElementById('ratingDisplay').textContent = '⭐ ' + playerRating;
        }

        // ---- ПАКИ UI ----
        function showPacksUI() {
            document.getElementById('packs-overlay').style.display = 'flex';
            renderPacksUI();
        }

        function closePacksUI() {
            document.getElementById('packs-overlay').style.display = 'none';
        }

        function renderPacksUI() {
            const list = document.getElementById('packs-list');
            document.getElementById('packs-crystals').textContent = '💎 Кристаллов: ' + playerCrystals;

            let html = '';
            const packTypes = ['common', 'rare', 'epic', 'legendary'];
            packTypes.forEach(type => {
                const price = PACK_PRICES[type];
                const name = PACK_NAMES[type];
                const canBuy = playerCrystals >= price;
                const rarityClass = 'rarity-' + type;
                html += `
                    <div class="pack-item ${rarityClass}">
                        <div class="pack-info">
                            <div class="pack-name">${name}</div>
                            <div class="pack-desc">Шансы: ${Object.entries(PACK_DROPS[type]).map(([k,v]) => RARITY_NAMES[k]+' '+v+'%').join(', ')}</div>
                        </div>
                        <div class="pack-price">${price}💎</div>
                        <button class="pack-btn" onclick="openPack('${type}')" ${canBuy ? '' : 'disabled'}>
                            ${canBuy ? 'Открыть' : 'Нет 💎'}
                        </button>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        // ---- ИНВЕНТАРЬ UI ----
        function showInventoryUI() {
            document.getElementById('inventory-overlay').style.display = 'flex';
            renderInventoryUI();
        }

        function closeInventoryUI() {
            document.getElementById('inventory-overlay').style.display = 'none';
        }

        function renderInventoryUI() {
            const list = document.getElementById('inventory-list');
            const stats = document.getElementById('inventory-stats');
            stats.textContent = '💎 ' + playerCrystals + ' кристаллов | ⭐ ' + playerRating + '/99 рейтинга';

            let html = '';

            html += '<div class="inv-section-title">⭐ ЭКИПИРОВАНО</div>';
            for (let slot = 1; slot <= 5; slot++) {
                const name = equippedSkins[slot] || 'Пусто';
                const data = SKIN_DATA[name];
                const rating = data ? data.rating : 0;
                const rarity = data ? data.rarity : 'common';
                const rarityClass = 'rarity-' + rarity;
                html += `
                    <div class="skin-item ${rarityClass}">
                        <div class="skin-info">
                            <span class="skin-name">${RARITY_NAMES[rarity]} ${name}</span>
                            <span class="skin-desc">Слот ${slot} | ⭐+${rating}</span>
                        </div>
                        <span class="equipped-badge">✅</span>
                        ${name !== 'Пусто' ? `<button class="skin-btn" onclick="removeSkinFromSlot(${slot})">Снять</button>` : ''}
                    </div>
                `;
            }

            const ownedList = Object.keys(ownedSkins);
            if (ownedList.length > 0) {
                html += '<div class="inv-section-title">📦 В ИНВЕНТАРЕ</div>';
                ownedList.forEach(name => {
                    const data = SKIN_DATA[name];
                    if (!data) return;
                    const count = ownedSkins[name];
                    const isEquipped = Object.values(equippedSkins).includes(name);
                    const rarityClass = 'rarity-' + data.rarity;
                    html += `
                        <div class="skin-item ${rarityClass}">
                            <div class="skin-info">
                                <span class="skin-name">${RARITY_NAMES[data.rarity]} ${name} ${count > 1 ? '×'+count : ''}</span>
                                <span class="skin-desc">Слот ${data.slot} | ⭐+${data.rating} ${isEquipped ? '| ✅ Экипирован' : ''}</span>
                            </div>
                            ${!isEquipped ? `<button class="skin-btn" onclick="equipSkinFromUI('${name}')">Надеть</button>` : ''}
                        </div>
                    `;
                });
            } else {
                html += '<div class="skin-item" style="justify-content:center;color:rgba(255,255,255,0.2);padding:20px;">У вас пока нет скинов. Открывайте паки! 📦</div>';
            }

            list.innerHTML = html;
        }

        // ============================================================
        // ==================== ОНЛАЙН СИСТЕМА ========================
        // ============================================================

        // ---- ОНЛАЙН UI ----
        function showOnlineUI() {
            if (!playerName) {
                showMessage('❌ Сначала войдите в аккаунт!');
                return;
            }
            document.getElementById('online-overlay').style.display = 'flex';
            document.getElementById('online-status-text').textContent = '⚡ Выберите режим';
        }

        function closeOnlineUI() {
            document.getElementById('online-overlay').style.display = 'none';
        }

        // ---- СОЗДАНИЕ ЛОББИ UI ----
        function showCreateLobbyUI() {
            closeOnlineUI();
            document.getElementById('create-lobby-overlay').style.display = 'flex';
            document.getElementById('lobbyNameInput').value = 'Лобби ' + playerName;
            document.getElementById('create-lobby-msg').textContent = '';
            document.querySelectorAll('#create-lobby-container .mode-select .btn').forEach(b => b.classList.remove('active'));
            document.querySelector('#create-lobby-container .mode-select .btn:first-child').classList.add('active');
            lobbyMode = '1x1';
        }

        function closeCreateLobbyUI() {
            document.getElementById('create-lobby-overlay').style.display = 'none';
            showOnlineUI();
        }

        function selectLobbyMode(mode, btn) {
            document.querySelectorAll('#create-lobby-container .mode-select .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            lobbyMode = mode;
        }

        // ---- ПОИСК ЛОББИ UI ----
        function showFindLobbyUI() {
            closeOnlineUI();
            document.getElementById('find-lobby-overlay').style.display = 'flex';
            findLobbies();
        }

        function closeFindLobbyUI() {
            document.getElementById('find-lobby-overlay').style.display = 'none';
            showOnlineUI();
        }

        // ---- ЛОББИ UI ----
        function showLobbyUI() {
            document.getElementById('lobby-overlay').style.display = 'flex';
            updateLobbyUI();
        }

        function closeLobbyUI() {
            document.getElementById('lobby-overlay').style.display = 'none';
        }

        // ---- СОЗДАНИЕ ЛОББИ (API) ----
        async function createLobby() {
            const lobbyName = document.getElementById('lobbyNameInput').value.trim() || 'Лобби ' + playerName;

            if (!playerName) {
                showMessage('❌ Сначала войдите в аккаунт!');
                return;
            }

            const result = await apiCall('/api/lobby/create', {
                name: lobbyName,
                host: playerName,
                mode: lobbyMode
            });

            if (result.error) {
                showMessage('❌ ' + result.error);
                return;
            }

            currentLobby = result.lobby_id;
            isInLobby = true;
            isHost = true;
            lobbyPlayers = [playerName];

            closeCreateLobbyUI();
            showLobbyUI();
            showMessage('✅ Лобби "' + lobbyName + '" создано! Ожидайте игрока...');
            updateLobbyUI();

            // Запускаем обновление лобби
            startLobbySync();
        }

        // ---- ПОИСК ЛОББИ (API) ----
        async function findLobbies() {
            const list = document.getElementById('lobby-list');
            if (!list) return;

            const result = await apiGet('/api/lobby/list');

            if (result.error) {
                list.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:20px;">Ошибка загрузки</div>';
                return;
            }

            if (result.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:20px;">Нет доступных лобби</div>';
                return;
            }

            let html = '';
            result.forEach(lobby => {
                const isFull = lobby.players.length >= 2;
                html += `
                    <div class="lobby-item">
                        <div class="lobby-info-text">
                            <div class="lobby-name">${lobby.name}</div>
                            <div class="lobby-desc">👤 ${lobby.host} | ${lobby.mode} | ${lobby.players.length}/2 игроков</div>
                        </div>
                        ${!isFull && lobby.host !== playerName ? 
                            `<button class="join-btn" onclick="joinLobby('${lobby.id}')">🔗 Присоединиться</button>` : 
                            `<span style="color:rgba(255,255,255,0.2);font-size:12px;">${isFull ? '🟢 Полно' : '❌ Ваше лобби'}</span>`
                        }
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        // ---- ПРИСОЕДИНЕНИЕ К ЛОББИ (API) ----
        async function joinLobby(lobbyId) {
            const result = await apiCall('/api/lobby/join', {
                lobby_id: lobbyId,
                player: playerName
            });

            if (result.error) {
                showMessage('❌ ' + result.error);
                return;
            }

            currentLobby = lobbyId;
            isInLobby = true;
            isHost = false;
            lobbyPlayers = result.lobby.players;

            closeFindLobbyUI();
            showLobbyUI();
            showMessage('✅ Вы присоединились к лобби! Ожидайте начала матча...');
            updateLobbyUI();

            // Запускаем обновление лобби
            startLobbySync();
        }

        // ---- СИНХРОНИЗАЦИЯ ЛОББИ ----
        function startLobbySync() {
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(async () => {
                if (!currentLobby || !isInLobby) {
                    clearInterval(syncInterval);
                    syncInterval = null;
                    return;
                }
                await updateLobbyUI();
            }, 1500);
        }

        // ---- ВЫХОД ИЗ ЛОББИ (API) ----
        async function leaveLobby() {
            if (!currentLobby) return;

            if (syncInterval) {
                clearInterval(syncInterval);
                syncInterval = null;
            }

            const result = await apiCall('/api/lobby/leave', {
                lobby_id: currentLobby,
                player: playerName
            });

            if (result.error) {
                showMessage('❌ ' + result.error);
                return;
            }

            currentLobby = null;
            isInLobby = false;
            isHost = false;
            onlineMatchStarted = false;
            lobbyPlayers = [];

            closeLobbyUI();
            showOnlineUI();
            showMessage('🚪 Вы вышли из лобби');
        }

        // ---- ОБНОВЛЕНИЕ ЛОББИ UI (API) ----
        async function updateLobbyUI() {
            if (!currentLobby) return;

            const result = await apiGet('/api/lobby/list');
            if (result.error) return;

            const lobby = result.find(l => l.id === currentLobby);
            if (!lobby) {
                closeLobbyUI();
                showMessage('❌ Лобби было удалено');
                if (syncInterval) {
                    clearInterval(syncInterval);
                    syncInterval = null;
                }
                return;
            }

            lobbyPlayers = lobby.players;

            document.getElementById('lobby-title').textContent = '🏠 ' + lobby.name;
            document.getElementById('lobby-info').textContent = '📊 Режим: ' + lobby.mode;

            let playersHtml = '';
            lobby.players.forEach(p => {
                const isHostPlayer = p === lobby.host;
                const isMe = p === playerName;
                playersHtml += `
                    <div class="lobby-player" style="${isMe ? 'border-left: 3px solid #ffd700;' : ''}">
                        <span>${p} ${isHostPlayer ? '👑' : ''} ${isMe ? ' (Вы)' : ''}</span>
                        <span class="${isHostPlayer ? 'host-badge' : 'ready-badge'}">
                            ${isHostPlayer ? 'Хост' : '✅ Готов'}
                        </span>
                    </div>
                `;
            });

            const emptySlots = 2 - lobby.players.length;
            for (let i = 0; i < emptySlots; i++) {
                playersHtml += `
                    <div class="lobby-player">
                        <span style="color:rgba(255,255,255,0.2);">🔲 Свободно</span>
                        <span class="waiting-badge">Ожидание...</span>
                    </div>
                `;
            }

            document.getElementById('lobby-players-list').innerHTML = playersHtml;

            const statusText = document.getElementById('lobby-status-text');
            const startBtn = document.getElementById('lobby-start-btn');

            if (lobby.status === 'playing') {
                statusText.textContent = '⚽ Матч идёт...';
                startBtn.style.display = 'none';
            } else if (lobby.players.length >= 2) {
                statusText.textContent = '✅ Все игроки готовы!';
                if (isHost) {
                    startBtn.style.display = 'block';
                    startBtn.textContent = '▶️ НАЧАТЬ МАТЧ';
                } else {
                    startBtn.style.display = 'none';
                    statusText.textContent = '⏳ Ожидание начала матча хостом...';
                }
            } else {
                statusText.textContent = '⏳ Ожидание игроков... (' + lobby.players.length + '/2)';

        // ---- ДЖОСТИК ----
        function setupJoystick() {
            const base = document.getElementById('joystick-base');
            const thumb = document.getElementById('joystick-thumb');
            const area = document.getElementById('joystick-area');

            const handleMove = (clientX, clientY) => {
                const rect = base.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const maxDist = rect.width / 2 - 30;

                let dx = clientX - cx;
                let dy = clientY - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }

                thumb.style.left = (rect.width / 2 + dx - 27.5) + 'px';
                thumb.style.top = (rect.height / 2 + dy - 27.5) + 'px';

                joystickDX = dx / maxDist;
                joystickDY = dy / maxDist;
                joystickActive = dist > 10;
            };

            const handleEnd = () => {
                thumb.style.left = '50%';
                thumb.style.top = '50%';
                thumb.style.transform = 'translate(-50%, -50%)';
                joystickDX = 0;
                joystickDY = 0;
                joystickActive = false;
                joystickTouchId = null;
                keys.up = false;
                keys.down = false;
                keys.left = false;
                keys.right = false;
            };

            area.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                joystickTouchId = touch.identifier;
                handleMove(touch.clientX, touch.clientY);
            }, { passive: false });

            area.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        handleMove(touch.clientX, touch.clientY);
                        const deadZone = 0.15;
                        keys.up = joystickDY < -deadZone;
                        keys.down = joystickDY > deadZone;
                        keys.left = joystickDX < -deadZone;
                        keys.right = joystickDX > deadZone;
                    }
                }
            }, { passive: false });

            area.addEventListener('touchend', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        handleEnd();
                    }
                }
            }, { passive: false });

            area.addEventListener('touchcancel', handleEnd, { passive: false });

            let mouseDown = false;
            area.addEventListener('mousedown', (e) => {
                mouseDown = true;
                handleMove(e.clientX, e.clientY);
            });
            document.addEventListener('mousemove', (e) => {
                if (mouseDown) {
                    handleMove(e.clientX, e.clientY);
                    const deadZone = 0.15;
                    keys.up = joystickDY < -deadZone;
                    keys.down = joystickDY > deadZone;
                    keys.left = joystickDX < -deadZone;
                    keys.right = joystickDX > deadZone;
                }
            });
            document.addEventListener('mouseup', () => {
                if (mouseDown) {
                    mouseDown = false;
                    handleEnd();
                }
            });
        }

                    if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
                    if (e.key === ' ') { e.preventDefault();
                        handleShoot(); }
                    if (e.key === 'e') handlePass();

            });
            document.addEventListener('keyup', (e) => {

                if (e.key === 's' || e.key === 'ArrowDown') keys.down = false;
                if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
                if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
            });
        }

        // ---- ИГРОВОЙ ЦИКЛ ----
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // ---- ОБНОВЛЕНИЕ ----
        function update() {
            if (gameState !== 'playing' || matchFinished) return;

            // Таймер
            gameTime += 1 / 60;
            const remaining = Math.max(0, MATCH_TIME - gameTime);
            const mins = Math.floor(remaining / 60);
            const secs = Math.floor(remaining % 60);
            document.getElementById('timer-display').textContent = '⏱️ ' + mins + ':' + String(secs).padStart(2, '0');

            if (remaining <= 0 || homeScore >= 5 || awayScore >= 5) {
                endMatch();
                return;
            }

            // ---- МЯЧ ----
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.vx *= 0.98;
            ball.vy *= 0.98;
            if (Math.abs(ball.vx) < 0.02) ball.vx = 0;
            if (Math.abs(ball.vy) < 0.02) ball.vy = 0;

            const margin = 40;
            if (ball.x < margin + BALL_RADIUS) { ball.x = margin + BALL_RADIUS;
                ball.vx = Math.abs(ball.vx) * 0.3; }
            if (ball.x > FIELD_W - margin - BALL_RADIUS) { ball.x = FIELD_W - margin - BALL_RADIUS;
                ball.vx = -Math.abs(ball.vx) * 0.3; }
            if (ball.y < margin + BALL_RADIUS) { ball.y = margin + BALL_RADIUS;
                ball.vy = Math.abs(ball.vy) * 0.3; }
            if (ball.y > FIELD_H - margin - BALL_RADIUS) { ball.y = FIELD_H - margin - BALL_RADIUS;
                ball.vy = -Math.abs(ball.vy) * 0.3; }

            checkGoals();

            // ---- ПАС ----
            if (isPassing) {
                passTimer++;
                if (passTarget && Math.hypot(ball.x - passTarget.x, ball.y - passTarget.y) < 30) {
                    players.forEach(p2 => p2.hasBall = false);
                    passTarget.hasBall = true;
                    isPassing = false;
                    passTarget = null;
                    passTimer = 0;
                }
                if (passTimer > 120 || Math.abs(ball.vx) < 0.1 && Math.abs(ball.vy) < 0.1) {
                    isPassing = false;
                    passTarget = null;
                    passTimer = 0;
                }
            }

            if (isShooting) {
                shootTimer++;
                if (shootTimer > 30) {
                    isShooting = false;
                    shootTimer = 0;
                }
            }

            const diffSettings = {
                easy: { speed: 0.4, accuracy: 0.3, aggression: 0.2, reaction: 30 },
                medium: { speed: 0.6, accuracy: 0.6, aggression: 0.5, reaction: 20 },
                hard: { speed: 0.8, accuracy: 0.85, aggression: 0.8, reaction: 10 }
            };
            const diff = diffSettings[difficulty] || diffSettings.medium;

            // ---- ИГРОКИ ----
            players.forEach((p) => {
                if (p.isPlayer) {
                    let dx = 0,
                        dy = 0;
                    if (keys.up) dy = -PLAYER_SPEED;
                    if (keys.down) dy = PLAYER_SPEED;
                    if (keys.left) dx = -PLAYER_SPEED;
                    if (keys.right) dx = PLAYER_SPEED;
                    if (dx && dy) { dx *= 0.707;
                        dy *= 0.707; }
                    p.x += dx;
                    p.y += dy;
                    p.x = Math.max(40, Math.min(FIELD_W - 40, p.x));
                    p.y = Math.max(40, Math.min(FIELD_H - 40, p.y));
                    if (p.hasBall && !isPassing && !isShooting) {
                        ball.x = p.x + 22;
                        ball.y = p.y;
                        ball.vx = 0;
                        ball.vy = 0;
                    }
                } else {
                    if (!isOnline) {
                        updateBot(p, diff);
                    }
                }
                if (p.passCooldown > 0) p.passCooldown--;
            });

            // ---- ВРАТАРИ ----
            goalkeepers.forEach(gk => {
                const targetX = gk.team === 'home' ? 60 : 1140;
                const targetY = 350 + (ball.y - 350) * 0.15;
                gk.x += (targetX - gk.x) * 0.04;
                gk.y += (targetY - gk.y) * 0.04;
                gk.x = Math.max(gk.team === 'home' ? 25 : 1150 - 25, Math.min(gk.team === 'home' ? 100 : 1175, gk
                .x));
                gk.y = Math.max(270, Math.min(430, gk.y));

                if (Math.hypot(gk.x - ball.x, gk.y - ball.y) < gk.radius + BALL_RADIUS + 5) {
                    const distToGoal = gk.team === 'home' ? ball.x : FIELD_W - ball.x;
                    if (distToGoal < 200 && Math.abs(ball.vx) < 4) {
                        ball.vx *= -0.2;
                        ball.vy *= -0.2;
                        if (Math.abs(ball.vx) < 0.5) {
                            const ang = gk.team === 'home' ? -0.2 + Math.random() * 0.4 : Math.PI - 0.2 + Math
                            .random() * 0.4;
                            ball.vx = (gk.team === 'home' ? 1 : -1) * (1.5 + Math.random() * 2);
                            ball.vy = (Math.random() - 0.5) * 2;
                            players.forEach(p => p.hasBall = false);
                            isPassing = false;
                            passTarget = null;
                        }
                    }
                }
            });

            // ---- СТОЛКНОВЕНИЯ С МЯЧОМ ----
            if (!isPassing && !isShooting) {
                players.forEach(p => {
                    if (!p.hasBall && p.canGetBall) {
                        const dist = Math.hypot(p.x - ball.x, p.y - ball.y);
                        if (dist < p.radius + BALL_RADIUS + 2) {
                            const ang = Math.atan2(ball.y - p.y, ball.x - p.x);
                            const power = 0.4 + Math.random() * 0.4;
                            ball.vx = power * Math.cos(ang);
                            ball.vy = power * Math.sin(ang);
                            players.forEach(p2 => p2.hasBall = false);
                            p.hasBall = true;
                            if (!p.isPlayer && !isOnline) {
                                setTimeout(() => botAction(p, diff), 400 + Math.random() * 300);
                            }
                        }
                    }
                });
            }

            if (goalCooldown > 0) goalCooldown--;
        }

        // ---- БОТЫ (ОФФЛАЙН) ----
        function updateBot(p, diff) {
            const isHome = p.team === 'home';
            const role = p.role || 'midfielder';

            let targetX = 600,
                targetY = 350;

            if (p.hasBall) {
                if (isPassing) return;

                targetX = isHome ? FIELD_W - 120 : 120;
                targetY = 350 + (Math.random() - 0.5) * 60;

                const nearbyEnemy = players.some(p2 =>
                    p2.team !== p.team && Math.hypot(p.x - p2.x, p.y - p2.y) < 70
                );
                if (nearbyEnemy && Math.random() < 0.35 * diff.accuracy && p.passCooldown === 0 && !isPassing) {
                    botAction(p, diff);
                    return;
                }

                const distToGoal = isHome ? FIELD_W - p.x : p.x;
                if (distToGoal < 200 && Math.random() < 0.2 * diff.accuracy && !isPassing) {
                    botAction(p, diff);
                    return;
                }

                const dx = targetX - p.x;
                const dy = targetY - p.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 3) {
                    const speed = BOT_SPEED_BASE * (0.4 + diff.speed * 0.6);
                    const step = Math.min(speed, dist);
                    p.x += (dx / dist) * step;
                    p.y += (dy / dist) * step;
                    if (!isPassing && !isShooting) {
                        ball.x = p.x + 22;
                        ball.y = p.y;
                        ball.vx = 0;
                        ball.vy = 0;
                    }
                }
            } else {
                if (role === 'defender') {
                    targetX = isHome ? 180 + Math.random() * 60 : 1020 - Math.random() * 60;
                    targetY = 350 + (Math.random() - 0.5) * 100;
                } else if (role === 'midfielder') {
                    targetX = isHome ? 350 + Math.random() * 150 : 850 - Math.random() * 150;
                    targetY = 350 + (Math.random() - 0.5) * 120;
                } else {
                    targetX = isHome ? 950 + Math.random() * 60 : 250 - Math.random() * 60;
                    targetY = 350 + (Math.random() - 0.5) * 100;
                }

                const distToBall = Math.hypot(p.x - ball.x, p.y - ball.y);
                if (distToBall < 140 && !players.some(p2 => p2.team === p.team && p2.hasBall) && !isPassing && !isShooting) {
                    targetX = ball.x + (isHome ? 15 : -15);
                    targetY = ball.y;
                }

                players.forEach(p2 => {
                    if (p2.team !== p.team && p2.hasBall && Math.hypot(p.x - p2.x, p.y - p2.y) < 40 && !isPassing &&
                        !isShooting) {
                        if (Math.random() < diff.aggression * 0.25) {
                            const ang = Math.atan2(p2.y - p.y, p2.x - p.x);
                            ball.vx = 1.2 * Math.cos(ang + (Math.random() - 0.5) * 0.5);
                            ball.vy = 1.2 * Math.sin(ang + (Math.random() - 0.5) * 0.5);
                            p2.hasBall = false;
                            p.hasBall = true;
                        }
                    }
                });

                const dx = targetX - p.x;
                const dy = targetY - p.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 3) {
                    const speed = BOT_SPEED_BASE * (0.4 + diff.speed * 0.6) * 0.8;
                    const step = Math.min(speed, dist);
                    p.x += (dx / dist) * step;
                    p.y += (dy / dist) * step;
                }
            }

            if (Math.abs(p.x - p.lastX) < 0.3 && Math.abs(p.y - p.lastY) < 0.3) {
                p.stuckTimer++;
                if (p.stuckTimer > 50) {
                    targetX += (Math.random() - 0.5) * 80;
                    targetY += (Math.random() - 0.5) * 80;
                    p.stuckTimer = 0;
                }
            } else {
                p.stuckTimer = Math.max(0, p.stuckTimer - 2);
            }
            p.lastX = p.x;
            p.lastY = p.y;

            p.x = Math.max(45, Math.min(FIELD_W - 45, p.x));
            p.y = Math.max(45, Math.min(FIELD_H - 45, p.y));
        }

        function botAction(p, diff) {
            if (!p.hasBall || matchFinished || p.passCooldown > 0 || isPassing || isShooting) return;

            const isHome = p.team === 'home';
            const r = Math.random();

            if (r < 0.45) {
                const teammates = players.filter(p2 => p2.team === p.team && p2.id !== p.id);
                if (teammates.length > 0) {
                    let best = null;
                    let bestScore = -999;
                    teammates.forEach(tm => {
                        const distToEnemy = Math.min(...players.filter(p2 => p2.team !== p.team)
                            .map(p2 => Math.hypot(tm.x - p2.x, tm.y - p2.y)));
                        const score = -Math.hypot(tm.x - p.x, tm.y - p.y) * 0.3 + distToEnemy * 0.5;
                        if (score > bestScore) { bestScore = score;
                            best = tm; }
                    });
                    if (best && Math.hypot(best.x - p.x, best.y - p.y) < 400) {
                        isPassing = true;
                        passTarget = best;
                        passTimer = 0;
                        const dist = Math.hypot(best.x - p.x, best.y - p.y);
                        const power = Math.min(6, Math.max(1.5, dist / 40));
                        const ang = Math.atan2(best.y - p.y, best.x - p.x);
                        ball.vx = power * Math.cos(ang + (Math.random() - 0.5) * 0.06);
                        ball.vy = power * Math.sin(ang + (Math.random() - 0.5) * 0.06);
                        p.hasBall = false;
                        p.passCooldown = 15;
                        setTimeout(() => {
                            if (isPassing && passTarget) {
                                players.forEach(p2 => p2.hasBall = false);
                                passTarget.hasBall = true;
                                isPassing = false;
                                passTarget = null;
                                passTimer = 0;
                            }
                        }, 700);
                        return;
                    }
                }
            }

            if (r < 0.75) {
                const goalX = isHome ? FIELD_W - 50 : 50;
                const goalY = 350 + (Math.random() - 0.5) * 60;
                const ang = Math.atan2(goalY - p.y, goalX - p.x);
                const power = 4 + Math.random() * 3;
                ball.vx = power * Math.cos(ang + (Math.random() - 0.5) * 0.12);
                ball.vy = power * Math.sin(ang + (Math.random() - 0.5) * 0.12);
                p.hasBall = false;
                isShooting = true;
                shootTimer = 0;
                return;
            }

            const goalX = isHome ? FIELD_W - 120 : 120;
            const goalY = 350 + (Math.random() - 0.5) * 40;
            const ang = Math.atan2(goalY - p.y, goalX - p.x);
            ball.vx = 1.2 * Math.cos(ang);
            ball.vy = 1.2 * Math.sin(ang);
            p.hasBall = false;
            setTimeout(() => {
                if (!isPassing && !isShooting) {
                    players.forEach(p2 => p2.hasBall = false);
                    p.hasBall = true;
                }
            }, 250);
        }

        // ---- ГОЛЫ ----
        function checkGoals() {
            if (goalCooldown > 0) return;

            if (ball.x < 35 && ball.y > 350 - GOAL_HEIGHT / 2 && ball.y < 350 + GOAL_HEIGHT / 2) {
                if (ball.vx < -0.2) {
                    awayScore++;
                    goalCooldown = 80;
                    document.getElementById('score-display').textContent = homeScore + ' : ' + awayScore;
                    showMessage('⚽ ГОЛ! Команда Б забила!');
                    if (awayScore >= 5) endMatch();
                    else resetBall();
                }
            }
            if (ball.x > FIELD_W - 35 && ball.y > 350 - GOAL_HEIGHT / 2 && ball.y < 350 + GOAL_HEIGHT / 2) {
                if (ball.vx > 0.2) {
                    homeScore++;
                    goalCooldown = 80;
                    document.getElementById('score-display').textContent = homeScore + ' : ' + awayScore;
                    showMessage('⚽ ГОЛ! Команда А забила!');
                    if (homeScore >= 5) endMatch();
                    else resetBall();
                }
            }
        }

        function resetBall() {
            ball.x = 600;
            ball.y = 350;
            ball.vx = (Math.random() - 0.5) * 0.8;
            ball.vy = (Math.random() - 0.5) * 0.8;
            players.forEach(p => p.hasBall = false);
            players[0].hasBall = true;
            isPassing = false;
            passTarget = null;
            isShooting = false;
            passTimer = 0;
            shootTimer = 0;
        }

        // ---- ЗАВЕРШЕНИЕ МАТЧА ----
        function endMatch() {
            if (matchFinished) return;
            matchFinished = true;
            const isWin = homeScore > awayScore;

            if (playerName && !isOnline) {
                playerMatches++;
                const diffBonus = difficulty === 'easy' ? 1 : difficulty === 'medium' ? 1.5 : 2;
                if (isWin) {
                    playerWins++;
                    const crystalsEarned = Math.floor(30 * diffBonus) + homeScore * 5 + (awayScore === 0 ? 20 : 0);
                    playerCrystals += crystalsEarned;
                    if (homeScore >= 3) playerCrystals += 15;
                    showMessage('🏆 ПОБЕДА! +' + crystalsEarned + '💎');
                } else {
                    playerCrystals += 10;
                    showMessage('💔 ПОРАЖЕНИЕ +10💎');
                }
                playerGoals += homeScore;
                saveGame();
                updateUI();
            }

            document.getElementById('statusBar').textContent = '🏁 ' + (isWin ? 'Победа!' : 'Поражение');

            setTimeout(() => {
                gameState = 'menu';
                document.getElementById('menu-container').style.display = 'block';
                document.getElementById('joystick-area').style.display = 'none';
                document.getElementById('action-buttons').style.display = 'none';
                document.getElementById('score-display').style.display = 'none';
                document.getElementById('timer-display').style.display = 'none';
                document.getElementById('statusBar').style.display = 'none';
                document.getElementById('online-status').style.display = 'none';
                isOnline = false;
                updateUI();
            }, 2500);
        }

        // ---- ДЕЙСТВИЯ ИГРОКА ----
        function handleShoot() {
            const p = players.find(p => p.isPlayer);
            if (!p || !p.hasBall || matchFinished || isPassing || isShooting) return;

            const isHome = p.team === 'home';
            const goalX = isHome ? FIELD_W - 50 : 50;
            const goalY = 350 + (Math.random() - 0.5) * 60;
            const ang = Math.atan2(goalY - p.y, goalX - p.x);
            const power = 4 + Math.random() * 3;

            ball.vx = power * Math.cos(ang + (Math.random() - 0.5) * 0.12);
            ball.vy = power * Math.sin(ang + (Math.random() - 0.5) * 0.12);
            p.hasBall = false;
            isShooting = true;
            shootTimer = 0;
        }

        function handlePass() {
            const p = players.find(p => p.isPlayer);
            if (!p || !p.hasBall || matchFinished || isPassing || isShooting) return;
            const teammates = players.filter(p2 => p2.team === p.team && p2.id !== p.id);
            if (teammates.length > 0) {
                let best = null;
                let bestScore = -999;
                teammates.forEach(tm => {
                    const dist = Math.hypot(tm.x - p.x, tm.y - p.y);
                    const score = -dist + Math.random() * 20;
                    if (score > bestScore) { bestScore = score;
                        best = tm; }
                });
                if (best && Math.hypot(best.x - p.x, best.y - p.y) < 400) {
                    isPassing = true;
                    passTarget = best;
                    passTimer = 0;
                    const dist = Math.hypot(best.x - p.x, best.y - p.y);
                    const power = Math.min(6, Math.max(1.5, dist / 40));
                    const ang = Math.atan2(best.y - p.y, best.x - p.x);
                    ball.vx = power * Math.cos(ang + (Math.random() - 0.5) * 0.06);
                    ball.vy = power * Math.sin(ang + (Math.random() - 0.5) * 0.06);
                    p.hasBall = false;
                    setTimeout(() => {
                        if (isPassing && passTarget) {
                            players.forEach(p2 => p2.hasBall = false);
                            passTarget.hasBall = true;
                            isPassing = false;
                            passTarget = null;
                            passTimer = 0;
                        }
                    }, 600);
                }
            }
        }

        function handleTackle() {
            const p = players.find(p => p.isPlayer);
            if (!p || matchFinished || isPassing || isShooting) return;
            players.forEach(p2 => {
                if (p2.team !== p.team && p2.hasBall && Math.hypot(p.x - p2.x, p.y - p2.y) < 40) {
                    const ang = Math.atan2(p2.y - p.y, p2.x - p.x);
                    ball.vx = 1.5 * Math.cos(ang + (Math.random() - 0.5) * 0.4);
                    ball.vy = 1.5 * Math.sin(ang + (Math.random() - 0.5) * 0.4);
                    p2.hasBall = false;
                    p.hasBall = true;
                }
            });
        }

        // ---- ОТРИСОВКА ----
        function render() {
            const w = canvas.width,
                h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            const scale = Math.min(w / FIELD_W, h / FIELD_H);
            const ox = (w - FIELD_W * scale) / 2;
            const oy = (h - FIELD_H * scale) / 2;

            ctx.save();
            ctx.translate(ox, oy);
            ctx.scale(scale, scale);

            ctx.fillStyle = '#1b4332';
            ctx.fillRect(0, 0, FIELD_W, FIELD_H);

            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 2;
            ctx.strokeRect(40, 40, FIELD_W - 80, FIELD_H - 80);
            ctx.beginPath();
            ctx.arc(FIELD_W / 2, FIELD_H / 2, 80, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(FIELD_W / 2, 40);
            ctx.lineTo(FIELD_W / 2, FIELD_H - 40);
            ctx.stroke();

            ctx.strokeRect(40, FIELD_H / 2 - 100, 120, 200);
            ctx.strokeRect(FIELD_W - 160, FIELD_H / 2 - 100, 120, 200);
            ctx.strokeRect(40, FIELD_H / 2 - 60, 60, 120);
            ctx.strokeRect(FIELD_W - 100, FIELD_H / 2 - 60, 60, 120);

            ctx.fillStyle = 'rgba(255,255,255,0.04)';
            ctx.fillRect(25, FIELD_H / 2 - GOAL_HEIGHT / 2, GOAL_WIDTH, GOAL_HEIGHT);
            ctx.fillRect(FIELD_W - 25 - GOAL_WIDTH, FIELD_H / 2 - GOAL_HEIGHT / 2, GOAL_WIDTH, GOAL_HEIGHT);
            ctx.strokeStyle = 'rgba(255,255,255,0.25)';
            ctx.lineWidth = 3;
            ctx.strokeRect(25, FIELD_H / 2 - GOAL_HEIGHT / 2, GOAL_WIDTH, GOAL_HEIGHT);
            ctx.strokeRect(FIELD_W - 25 - GOAL_WIDTH, FIELD_H / 2 - GOAL_HEIGHT / 2, GOAL_WIDTH, GOAL_HEIGHT);

            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i < GOAL_HEIGHT; i += 10) {
                ctx.beginPath();
                ctx.moveTo(25 + GOAL_WIDTH, FIELD_H / 2 - GOAL_HEIGHT / 2 + i);
                ctx.lineTo(50 + GOAL_WIDTH, FIELD_H / 2 - GOAL_HEIGHT / 2 + i);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(FIELD_W - 25 - GOAL_WIDTH - GOAL_WIDTH, FIELD_H / 2 - GOAL_HEIGHT / 2 + i);
                ctx.lineTo(FIELD_W - 25 - 2 * GOAL_WIDTH, FIELD_H / 2 - GOAL_HEIGHT / 2 + i);
                ctx.stroke();
            }

            // Мяч
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Вратари
            goalkeepers.forEach(gk => {
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(gk.x, gk.y, gk.radius, 0, Math.PI * 2);
                const grad = ctx.createRadialGradient(gk.x - 5, gk.y - 5, 3, gk.x, gk.y, gk.radius);
                grad.addColorStop(0, gk.team === 'home' ? '#4488ff' : '#ff4444');
                grad.addColorStop(1, gk.team === 'home' ? '#0033aa' : '#aa2200');
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🧤', gk.x, gk.y - gk.radius - 8);
            });

            // Игроки
            players.forEach(p => {
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                if (p.isPlayer) {
                    const grad = ctx.createRadialGradient(p.x - 5, p.y - 5, 3, p.x, p.y, p.radius);
                    grad.addColorStop(0, '#ffd700');
                    grad.addColorStop(1, '#e6a800');
                    ctx.fillStyle = grad;
                } else {
                    ctx.fillStyle = p.color;
                }
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'white';
                ctx.font = 'bold 9px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, p.x, p.y - p.radius - 10);

                if (p.hasBall) {
                    ctx.shadowColor = 'rgba(255,215,0,0.3)';
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                if (p.isPlayer) {
                    ctx.shadowColor = '#ffd700';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255,215,0,0.2)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                const roleEmojis = { defender: '🛡️', midfielder: '🎯', forward: '⚡' };
                ctx.font = '12px Arial';
                ctx.fillStyle = 'rgba(255,255,255,0.12)';
                ctx.fillText(roleEmojis[p.role] || '', p.x + p.radius + 8, p.y + 4);
            });

            ctx.restore();

            if (gameState === 'playing') {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(w / 2 - 45, 6, 90, 28);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(homeScore + ' : ' + awayScore, w / 2, 27);
            }
        }

        // ---- СООБЩЕНИЯ ----
        function showMessage(text) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 2500);
        }

        // ---- ЛОГИН ----
        function showLogin() {
            document.getElementById('login-container').style.display = 'block';
            document.getElementById('loginTitle').textContent = '🔑 Вход';
            document.getElementById('loginMsg').textContent = '';
            document.getElementById('loginMsg').className = '';
            document.getElementById('loginName').value = '';
            document.getElementById('loginPass').value = '';
        }

        function showRegister() {
            document.getElementById('login-container').style.display = 'block';
            document.getElementById('loginTitle').textContent = '📝 Регистрация';
            document.getElementById('loginMsg').textContent = '';
            document.getElementById('loginMsg').className = '';
            document.getElementById('loginName').value = '';
            document.getElementById('loginPass').value = '';
        }

        function closeLogin() {
            document.getElementById('login-container').style.display = 'none';
        }

        function handleLogin() {
            const name = document.getElementById('loginName').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const msg = document.getElementById('loginMsg');

            if (!name || !pass) { msg.textContent = '❌ Заполните все поля!';
                msg.className = 'login-error'; return; }

            const users = JSON.parse(localStorage.getItem('football_users') || '{}');
            const title = document.getElementById('loginTitle').textContent;
            const isRegister = title.includes('Регистрация');

            if (isRegister) {
                if (users[name]) { msg.textContent = '❌ Игрок уже существует!';
                    msg.className = 'login-error'; return; }
                users[name] = { password: pass, rating: 50, crystals: 100, wins: 0, matches: 0, goals: 0,
                    equippedSkins: { 1: 'Повязка', 2: 'Майка', 3: 'Шорты', 4: 'Кеды', 5: 'Нарукавник' },
                    ownedSkins: {} };
                localStorage.setItem('football_users', JSON.stringify(users));
                msg.textContent = '✅ Регистрация успешна!';
                msg.className = 'login-success';
            } else {
                if (!users[name]) { msg.textContent = '❌ Игрок не найден!';
                    msg.className = 'login-error'; return; }
                if (users[name].password !== pass) { msg.textContent = '❌ Неверный пароль!';
                    msg.className = 'login-error'; return; }
                msg.textContent = '✅ Вход выполнен!';
                msg.className = 'login-success';
            }

            const userData = users[name];
            playerName = name;
            playerRating = userData.rating || 50;
            playerCrystals = userData.crystals || 100;
            playerWins = userData.wins || 0;
            playerMatches = userData.matches || 0;
            playerGoals = userData.goals || 0;
            equippedSkins = userData.equippedSkins || { 1: 'Повязка', 2: 'Майка', 3: 'Шорты', 4: 'Кеды', 5: 'Нарукавник' };
            ownedSkins = userData.ownedSkins || {};
            recalcRating();
            saveGame();
            updateUI();

            setTimeout(() => {
                closeLogin();
                document.getElementById('loginMsg').textContent = '';
            }, 800);
        }

        // ---- ТАБЛИЦА ----
        function showLeaderboard() {
            const users = JSON.parse(localStorage.getItem('football_users') || '{}');
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';

            const sorted = Object.entries(users)
                .map(([name, data]) => ({ name, rating: data.rating || 50, wins: data.wins || 0, goals: data.goals ||
                        0 }))
                .sort((a, b) => b.rating - a.rating);

            if (sorted.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.2);padding:20px;">Нет игроков</div>';
            } else {
                sorted.forEach((p, i) => {
                    const div = document.createElement('div');
                    div.className = 'entry';
                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
                    div.innerHTML = `
                        <span class="rank">${medal}</span>
                        <span class="name">${p.name}</span>
                        <span class="rating">⭐ ${p.rating}</span>
                        <span class="wins">🏆 ${p.wins}</span>
                    `;
                    list.appendChild(div);
                });
            }

            document.getElementById('leaderboard').style.display = 'block';
        }

        function closeLeaderboard() {
            document.getElementById('leaderboard').style.display = 'none';
        }

        console.log('⚽ STREET FOOTBALL LEGENDS v9.0 загружена!');
        console.log('👤 Игрок:', playerName || 'Гость');
        console.log('⭐ Рейтинг:', playerRating);
        console.log('💎 Кристаллы:', playerCrystals);
        console.log('🌐 Онлайн синхронизация включена!');
    </script>
</body>
