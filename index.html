<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚽ STREET FOOTBALL - 1x1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: #0d1b2a;
            font-family: Arial, sans-serif;
            color: white;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #1b4332;
            image-rendering: pixelated;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .btn {
            pointer-events: auto;
            background: rgba(60, 60, 80, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.2s;
            touch-action: manipulation;
            width: 100%;
            text-align: center;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-blue {
            background: rgba(50, 100, 255, 0.7);
            border-color: #4d7aff;
        }
        .btn-red {
            background: rgba(200, 50, 50, 0.7);
            border-color: #ff6b6b;
        }
        .btn-green {
            background: rgba(0, 200, 100, 0.7);
            border-color: #51cf66;
        }
        .btn-gray {
            background: rgba(100, 100, 120, 0.7);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .btn-orange {
            background: rgba(255, 150, 50, 0.7);
            border-color: #ffa94d;
        }
        #menu-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            width: 94%;
            max-width: 440px;
            max-height: 95vh;
            overflow-y: auto;
        }
        #menu-container .title {
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            margin-bottom: 6px;
        }
        #menu-container .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            margin-bottom: 10px;
        }
        .btn-full {
            margin: 4px 0;
            padding: 10px;
            font-size: 14px;
        }
        #score-display {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 18px;
            border-radius: 10px;
            pointer-events: none;
            z-index: 20;
            display: none;
        }
        #timer-display {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.5);
            padding: 3px 10px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 20;
            display: none;
        }
        #statusBar {
            position: absolute;
            top: 55px;
            left: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 10px;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 8px;
            border-radius: 6px;
            display: none;
        }
        #ratingDisplay {
            position: absolute;
            top: 55px;
            right: 10px;
            color: #ffd700;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 8px;
            border-radius: 6px;
            display: none;
        }
        #online-status {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            color: #51cf66;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 12px;
            border-radius: 6px;
            display: none;
        }
        #joystick-area {
            position: absolute;
            bottom: 70px;
            left: 15px;
            width: 120px;
            height: 120px;
            pointer-events: auto;
            z-index: 30;
            display: none;
            touch-action: none;
        }
        #joystick-base {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            border: 3px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
        }
        #joystick-thumb {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, 0.6), rgba(200, 200, 200, 0.3));
            border: 2px solid rgba(255, 255, 255, 0.3);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            transition: none;
            pointer-events: none;
        }
        #joystick-center-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #action-buttons {
            position: absolute;
            bottom: 70px;
            right: 15px;
            display: none;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            z-index: 30;
        }
        .action-btn {
            pointer-events: auto;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            touch-action: manipulation;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .action-btn:active {
            transform: scale(0.92);
        }
        .btn-shoot {
            background: radial-gradient(circle at 40% 35%, rgba(255, 80, 80, 0.8), rgba(200, 30, 30, 0.6));
            border-color: rgba(255, 100, 100, 0.5);
        }
        .btn-tackle {
            background: radial-gradient(circle at 40% 35%, rgba(80, 80, 255, 0.8), rgba(30, 30, 200, 0.6));
            border-color: rgba(100, 100, 255, 0.5);
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            background: rgba(0, 0, 0, 0.8);
            padding: 14px 28px;
            border-radius: 14px;
            pointer-events: none;
            z-index: 40;
            display: none;
            text-align: center;
            max-width: 90%;
        }
        #lobby-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 95;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #lobby-container {
            background: rgba(13, 27, 42, 0.95);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
        }
        #lobby-container h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 8px;
            font-size: 20px;
        }
        .lobby-info {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 12px;
        }
        .lobby-players {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
        }
        .lobby-player {
            padding: 6px 10px;
            margin: 3px 0;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .lobby-player .host-badge {
            color: #ffd700;
            font-size: 11px;
        }
        .lobby-player .ready-badge {
            color: #51cf66;
            font-size: 11px;
        }
        .lobby-player .waiting-badge {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
        }
        #create-lobby-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 92;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #create-lobby-container {
            background: rgba(13, 27, 42, 0.95);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
        }
        #create-lobby-container h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 12px;
            font-size: 20px;
        }
        #create-lobby-container input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.06);
            color: white;
            font-size: 14px;
            pointer-events: auto;
            outline: none;
        }
        #create-lobby-container input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }
        #create-lobby-container input:focus {
            border-color: #ffd700;
        }
        .mode-select {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .mode-select .btn {
            flex: 1;
            padding: 8px;
            font-size: 13px;
        }
        .mode-select .btn.active {
            background: rgba(255, 215, 0, 0.3) !important;
            border-color: #ffd700 !important;
        }
        #find-lobby-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 93;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #find-lobby-container {
            background: rgba(13, 27, 42, 0.95);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
        }
        #find-lobby-container h2 {
            color: #4d7aff;
            text-align: center;
            margin-bottom: 12px;
            font-size: 20px;
        }
        .lobby-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .lobby-item .lobby-info-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .lobby-item .lobby-name {
            font-weight: bold;
            font-size: 14px;
        }
        .lobby-item .lobby-desc {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }
        .lobby-item .join-btn {
            background: rgba(81, 207, 102, 0.2);
            border: 1px solid rgba(81, 207, 102, 0.3);
            border-radius: 8px;
            padding: 6px 16px;
            color: #51cf66;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            pointer-events: auto !important;
            z-index: 100;
        }
        .lobby-item .join-btn:active {
            transform: scale(0.95);
            background: rgba(81, 207, 102, 0.4);
        }
        .refresh-btn {
            margin-bottom: 10px;
        }
        #online-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 90;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #online-container {
            background: rgba(13, 27, 42, 0.95);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
        }
        #online-container h2 {
            color: #4d7aff;
            text-align: center;
            margin-bottom: 8px;
            font-size: 22px;
        }
        .online-status-text {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 12px;
            min-height: 24px;
        }
        .online-btn {
            margin: 4px 0;
        }
        .close-online {
            margin-top: 12px;
        }
        #login-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(13, 27, 42, 0.95);
            border-radius: 16px;
            padding: 20px;
            width: 92%;
            max-width: 380px;
            z-index: 60;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #login-container h2 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 18px;
        }
        #login-container input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.06);
            color: white;
            font-size: 14px;
            pointer-events: auto;
            outline: none;
        }
        #login-container input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }
        #login-container input:focus {
            border-color: #ffd700;
        }
        #login-container .btn {
            margin: 3px 0;
        }
        #loginMsg {
            text-align: center;
            margin-top: 6px;
            font-size: 12px;
            min-height: 18px;
        }
        .login-success {
            color: #51cf66 !important;
        }
        .login-error {
            color: #ff6b6b !important;
        }
        #exit-match-btn {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            z-index: 50;
            display: none;
            font-size: 12px;
            padding: 8px;
        }
        @media(max-width:600px) {
            #joystick-area {
                width: 100px;
                height: 100px;
                bottom: 60px;
                left: 10px;
            }
            #joystick-base {
                width: 100px;
                height: 100px;
            }
            #joystick-thumb {
                width: 42px;
                height: 42px;
            }
            .action-btn {
                width: 50px;
                height: 50px;
                font-size: 10px;
            }
            #action-buttons {
                gap: 8px;
                bottom: 60px;
                right: 10px;
            }
            #menu-container .title {
                font-size: 22px;
            }
            #score-display {
                font-size: 22px;
                padding: 2px 14px;
            }
            .btn {
                font-size: 12px;
                padding: 8px 10px;
            }
            .lobby-item {
                flex-wrap: wrap;
                gap: 8px;
            }
            .lobby-item .join-btn {
                width: 100%;
                text-align: center;
            }
            #exit-match-btn {
                width: 130px;
                font-size: 11px;
                padding: 6px;
            }
        }
        @media(max-width:400px) {
            #joystick-area {
                width: 80px;
                height: 80px;
                bottom: 50px;
                left: 8px;
            }
            #joystick-base {
                width: 80px;
                height: 80px;
            }
            #joystick-thumb {
                width: 34px;
                height: 34px;
            }
            .action-btn {
                width: 44px;
                height: 44px;
                font-size: 9px;
            }
            #action-buttons {
                gap: 6px;
                bottom: 50px;
                right: 8px;
            }
            #score-display {
                font-size: 18px;
                padding: 2px 10px;
            }
            #timer-display {
                font-size: 12px;
                padding: 2px 8px;
            }
            .btn {
                font-size: 11px;
                padding: 6px 8px;
            }
            #exit-match-btn {
                width: 100px;
                font-size: 10px;
                padding: 4px;
            }
        }
        @media(orientation: landscape) and (max-height: 500px) {
            #joystick-area {
                width: 80px;
                height: 80px;
                bottom: 40px;
                left: 10px;
            }
            #joystick-base {
                width: 80px;
                height: 80px;
            }
            #joystick-thumb {
                width: 34px;
                height: 34px;
            }
            .action-btn {
                width: 44px;
                height: 44px;
                font-size: 9px;
            }
            #action-buttons {
                gap: 6px;
                bottom: 40px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui-overlay">
        <div id="score-display">0 : 0</div>
        <div id="timer-display">⏱️ 5:00</div>
        <div id="statusBar">⚽ Добро пожаловать!</div>
        <div id="ratingDisplay">⭐ 50</div>
        <div id="online-status"></div>

        <div id="menu-container">
            <div class="title">⚽ STREET<br>FOOTBALL</div>
            <div class="subtitle" id="playerInfo">👤 Гость | ⭐ 50 | 💎 100</div>
            <button class="btn btn-orange btn-full" onclick="showOnlineUI()">🌐 ОНЛАЙН</button>
            <div id="guestMenu">
                <button class="btn btn-blue btn-full" onclick="showLogin()">🔑 Войти</button>
                <button class="btn btn-blue btn-full" onclick="showRegister()">📝 Регистрация</button>
            </div>
        </div>

        <div id="login-container">
            <h2 id="loginTitle">🔑 Вход</h2>
            <input type="text" id="loginName" placeholder="Имя игрока">
            <input type="password" id="loginPass" placeholder="Пароль">
            <button class="btn btn-blue" onclick="handleLogin()">✅ Войти</button>
            <button class="btn btn-gray" onclick="closeLogin()">↩️ Назад</button>
            <div id="loginMsg"></div>
        </div>

        <div id="online-overlay">
            <div id="online-container">
                <h2>🌐 ОНЛАЙН</h2>
                <div class="online-status-text" id="online-status-text">⚡ Выберите действие</div>
                <button class="btn btn-green online-btn" onclick="showCreateLobbyUI()">🏠 СОЗДАТЬ ЛОББИ</button>
                <button class="btn btn-blue online-btn" onclick="showFindLobbyUI()">🔍 НАЙТИ ЛОББИ</button>
                <button class="btn btn-gray" onclick="closeOnlineUI()">↩️ Назад</button>
            </div>
        </div>

        <div id="create-lobby-overlay">
            <div id="create-lobby-container">
                <h2>🏠 СОЗДАНИЕ ЛОББИ</h2>
                <input type="text" id="lobbyNameInput" placeholder="Название лобби">
                <div class="mode-select">
                    <button class="btn active" onclick="selectLobbyMode('1x1', this)">⚔️ 1x1</button>
                    <button class="btn" onclick="selectLobbyMode('2x2', this)">⚔️ 2x2</button>
                </div>
                <button class="btn btn-green" onclick="createLobby()">✅ СОЗДАТЬ</button>
                <button class="btn btn-gray" onclick="closeCreateLobbyUI()">↩️ Назад</button>
                <div id="create-lobby-msg"></div>
            </div>
        </div>

        <div id="find-lobby-overlay">
            <div id="find-lobby-container">
                <h2>🔍 ПОИСК ЛОББИ</h2>
                <button class="btn btn-blue refresh-btn" onclick="findLobbies()">🔄 Обновить</button>
                <div id="lobby-list"></div>
                <button class="btn btn-gray" onclick="closeFindLobbyUI()">↩️ Назад</button>
            </div>
        </div>

        <div id="lobby-overlay">
            <div id="lobby-container">
                <h2 id="lobby-title">🏠 ЛОББИ</h2>
                <div class="lobby-info" id="lobby-info">📊 Режим: 1x1</div>
                <div class="lobby-players" id="lobby-players-list"></div>
                <div class="lobby-info" id="lobby-status-text">⏳ Ожидание игроков...</div>
                <button class="btn btn-green" id="lobby-start-btn" onclick="startOnlineMatch()" style="display:none;">▶️ НАЧАТЬ МАТЧ</button>
                <button class="btn btn-red" onclick="leaveLobby()">🚪 ВЫЙТИ</button>
                <div id="lobby-msg"></div>
            </div>
        </div>

        <div id="message"></div>

        <div id="joystick-area">
            <div id="joystick-base">
                <div id="joystick-thumb"></div>
                <div id="joystick-center-dot"></div>
            </div>
        </div>

        <div id="action-buttons">
            <button class="action-btn btn-shoot" id="btn-shoot">⚽<br>Удар</button>
            <button class="action-btn btn-tackle" id="btn-tackle">🛡️<br>Отбор</button>
        </div>

        <button class="btn btn-red" id="exit-match-btn" onclick="leaveMatch()">🚪 ВЫЙТИ</button>
    </div>

    <script>
        // ============================================================
        // ==================== КЛИЕНТ ================================
        // ============================================================

        const SERVER_URL = 'https://machcup-mobile-server.onrender.com';

        let canvas, ctx;
        let gameState = 'menu';
        let mode = '2x2';
        let playerName = '';
        let playerRating = 50;
        let playerCrystals = 100;
        let lobbyMode = '1x1';

        // ---- ОНЛАЙН ----
        let currentLobby = null;
        let isInLobby = false;
        let isHost = false;
        let isOnline = false;
        let opponentName = '';
        let matchId = null;
        let matchState = null;
        let isMatchSubscribed = false;
        let localPlayers = {};
        let localBall = { x: 600, y: 350 };
        let homeScore = 0,
            awayScore = 0;
        let gameTime = 0;
        let matchFinished = false;
        let syncInterval = null;
        let socket = null;
        let lastDirection = { dx: 0, dy: 0 };

        // ============================================================
        // ====== API ==================================================
        // ============================================================

        async function apiCall(endpoint, data) {
            try {
                const res = await fetch(SERVER_URL + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return await res.json();
            } catch (e) {
                return { error: 'Ошибка соединения' };
            }
        }

        async function apiGet(endpoint) {
            try {
                const res = await fetch(SERVER_URL + endpoint);
                return await res.json();
            } catch (e) {
                return { error: 'Ошибка соединения' };
            }
        }

        // ============================================================
        // ====== WEBSOCKET ============================================
        // ============================================================

        function initSocket() {
            try {
                const wsUrl = SERVER_URL.replace('https://', 'wss://').replace('http://', 'ws://');
                socket = new WebSocket(wsUrl + '/socket.io/?EIO=4&transport=websocket');
                socket.onopen = function() {
                    console.log('🔌 WebSocket подключен');
                    if (currentLobby && isInLobby) subscribeLobby(currentLobby);
                    if (matchId) subscribeMatch(matchId);
                };
                socket.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'lobby_update') {
                            handleLobbyUpdate(data);
                        } else if (data.type === 'match_update') {
                            handleMatchUpdate(data);
                        }
                    } catch (e) {}
                };
                socket.onclose = function() { setTimeout(initSocket, 3000); };
            } catch (e) {}
        }

        function subscribeLobby(lobbyId) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'subscribe', lobby_id: lobbyId }));
            }
        }

        function subscribeMatch(matchId) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'subscribe_match', match_id: matchId }));
                isMatchSubscribed = true;
            }
        }

        function handleLobbyUpdate(data) {
            if (currentLobby === data.lobby_id && isInLobby) updateLobbyUI();
        }

        function handleMatchUpdate(data) {
            if (matchId === data.match_id) {
                matchState = data.state;
                if (gameState === 'playing') updateGameFromState(data.state);
            }
        }

        // ============================================================
        // ====== СОХРАНЕНИЕ ==========================================
        // ============================================================

        function loadSave() {
            try {
                const data = localStorage.getItem('football_save');
                if (data) {
                    const save = JSON.parse(data);
                    playerName = save.name || '';
                    playerRating = save.rating || 50;
                    playerCrystals = save.crystals || 100;
                }
            } catch (e) {}
        }

        function saveGame() {
            localStorage.setItem('football_save', JSON.stringify({
                name: playerName,
                rating: playerRating,
                crystals: playerCrystals
            }));
        }

        function updateUI() {
            const info = document.getElementById('playerInfo');
            if (!info) return;

            if (playerName) {
                info.textContent = '👤 ' + playerName + ' | ⭐ ' + playerRating + ' | 💎 ' + playerCrystals;
                const guestMenu = document.getElementById('guestMenu');
                if (guestMenu) guestMenu.style.display = 'none';
            } else {
                info.textContent = '👤 Гость | ⭐ 50 | 💎 100';
                const guestMenu = document.getElementById('guestMenu');
                if (guestMenu) guestMenu.style.display = 'block';
            }
            const ratingDisplay = document.getElementById('ratingDisplay');
            if (ratingDisplay) ratingDisplay.textContent = '⭐ ' + playerRating;
        }

        // ============================================================
        // ====== UI ==================================================
        // ============================================================

        function showOnlineUI() {
            if (!playerName) { showMessage('❌ Сначала войдите!'); return; }
            const el = document.getElementById('online-overlay');
            if (el) el.style.display = 'flex';
        }

        function closeOnlineUI() {
            const el = document.getElementById('online-overlay');
            if (el) el.style.display = 'none';
        }

        function showCreateLobbyUI() {
            closeOnlineUI();
            const el = document.getElementById('create-lobby-overlay');
            if (el) el.style.display = 'flex';
            const input = document.getElementById('lobbyNameInput');
            if (input) input.value = 'Лобби ' + playerName;
            const msg = document.getElementById('create-lobby-msg');
            if (msg) msg.textContent = '';
            document.querySelectorAll('#create-lobby-container .mode-select .btn').forEach(b => b.classList.remove('active'));
            const first = document.querySelector('#create-lobby-container .mode-select .btn:first-child');
            if (first) first.classList.add('active');
            lobbyMode = '1x1';
        }

        function closeCreateLobbyUI() {
            const el = document.getElementById('create-lobby-overlay');
            if (el) el.style.display = 'none';
            showOnlineUI();
        }

        function selectLobbyMode(mode, btn) {
            document.querySelectorAll('#create-lobby-container .mode-select .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            lobbyMode = mode;
        }

        function showFindLobbyUI() {
            closeOnlineUI();
            const el = document.getElementById('find-lobby-overlay');
            if (el) el.style.display = 'flex';
            findLobbies();
        }

        function closeFindLobbyUI() {
            const el = document.getElementById('find-lobby-overlay');
            if (el) el.style.display = 'none';
            showOnlineUI();
        }

        function showLobbyUI() {
            const el = document.getElementById('lobby-overlay');
            if (el) el.style.display = 'flex';
            updateLobbyUI();
        }

        function closeLobbyUI() {
            const el = document.getElementById('lobby-overlay');
            if (el) el.style.display = 'none';
        }

        // ============================================================
        // ====== ЛОГИН ===============================================
        // ============================================================

        function showLogin() {
            const el = document.getElementById('login-container');
            if (el) el.style.display = 'block';
            const title = document.getElementById('loginTitle');
            if (title) title.textContent = '🔑 Вход';
            const msg = document.getElementById('loginMsg');
            if (msg) { msg.textContent = '';
                msg.className = ''; }
            const name = document.getElementById('loginName');
            if (name) name.value = '';
            const pass = document.getElementById('loginPass');
            if (pass) pass.value = '';
        }

        function showRegister() {
            const el = document.getElementById('login-container');
            if (el) el.style.display = 'block';
            const title = document.getElementById('loginTitle');
            if (title) title.textContent = '📝 Регистрация';
            const msg = document.getElementById('loginMsg');
            if (msg) { msg.textContent = '';
                msg.className = ''; }
            const name = document.getElementById('loginName');
            if (name) name.value = '';
            const pass = document.getElementById('loginPass');
            if (pass) pass.value = '';
        }

        function closeLogin() {
            const el = document.getElementById('login-container');
            if (el) el.style.display = 'none';
        }

        async function handleLogin() {
            const nameInput = document.getElementById('loginName');
            const passInput = document.getElementById('loginPass');
            const msg = document.getElementById('loginMsg');

            if (!nameInput || !passInput || !msg) return;

            const name = nameInput.value.trim();
            const pass = passInput.value.trim();

            if (!name || !pass) {
                msg.textContent = '❌ Заполните все поля!';
                msg.className = 'login-error';
                return;
            }

            const title = document.getElementById('loginTitle');
            const isRegister = title ? title.textContent.includes('Регистрация') : false;
            const result = await apiCall(isRegister ? '/api/register' : '/api/login', { name, password: pass });

            if (result.error) {
                msg.textContent = '❌ ' + result.error;
                msg.className = 'login-error';
                return;
            }

            msg.textContent = '✅ Успешно!';
            msg.className = 'login-success';

            playerName = name;
            if (result.player) {
                playerRating = result.player.rating || 50;
                playerCrystals = result.player.crystals || 100;
            }
            saveGame();
            updateUI();

            setTimeout(() => {
                closeLogin();
                if (msg) { msg.textContent = '';
                    msg.className = ''; }
                showMessage('👋 Добро пожаловать, ' + playerName + '!');
            }, 1000);
        }

        // ============================================================
        // ====== ЛОББИ ===============================================
        // ============================================================

        async function createLobby() {
            const input = document.getElementById('lobbyNameInput');
            const lobbyName = input ? input.value.trim() || 'Лобби ' + playerName : 'Лобби ' + playerName;
            if (!playerName) { showMessage('❌ Войдите в аккаунт!'); return; }

            const result = await apiCall('/api/lobby/create', {
                name: lobbyName,
                host: playerName,
                mode: lobbyMode
            });

            if (result.error) {
                showMessage('❌ ' + result.error);
                return;
            }

            currentLobby = result.lobby_id;
            isInLobby = true;
            isHost = true;

            closeCreateLobbyUI();
            showLobbyUI();
            showMessage('✅ Лобби "' + lobbyName + '" создано!');
            subscribeLobby(currentLobby);
            updateLobbyUI();
            startLobbySync();
        }

        async function findLobbies() {
            const list = document.getElementById('lobby-list');
            if (!list) return;

            const result = await apiGet('/api/lobby/list');

            if (result.error || result.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:20px;">Нет доступных лобби</div>';
                return;
            }

            let html = '';
            result.forEach(lobby => {
                const isFull = lobby.players.length >= 2;
                html += `
                            <div class="lobby-item">
                                <div class="lobby-info-text">
                                    <div class="lobby-name">${lobby.name}</div>
                                    <div class="lobby-desc">👤 ${lobby.host} | ${lobby.mode} | ${lobby.players.length}/2</div>
                                </div>
                                ${!isFull && lobby.host !== playerName ? 
                                    `<button class="join-btn" onclick="joinLobby('${lobby.id}')">🔗 Присоединиться</button>` : 
                                    `<span style="color:rgba(255,255,255,0.2);">${isFull ? '🟢 Полно' : '❌ Ваше'}</span>`
                                }
                            </div>
                        `;
            });
            list.innerHTML = html;
        }

        async function joinLobby(lobbyId) {
            const result = await apiCall('/api/lobby/join', {
                lobby_id: lobbyId,
                player: playerName
            });

            if (result.error) {
                showMessage('❌ ' + result.error);
                return;
            }

            currentLobby = lobbyId;
            isInLobby = true;
            isHost = false;

            closeFindLobbyUI();
            showLobbyUI();
            showMessage('✅ Вы присоединились!');
            subscribeLobby(currentLobby);
            updateLobbyUI();
            startLobbySync();
        }

        function startLobbySync() {
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(async () => {
                if (!currentLobby || !isInLobby) {
                    clearInterval(syncInterval);
                    syncInterval = null;
                    return;
                }
                const result = await apiGet('/api/lobby/get/' + currentLobby);
                if (result.error) {
                    closeLobbyUI();
                    showMessage('❌ Лобби удалено');
                    if (syncInterval) { clearInterval(syncInterval);
                        syncInterval = null; }
                    return;
                }
                updateLobbyUI();
            }, 2000);
        }

        async function leaveLobby() {
            if (!currentLobby) return;
            if (syncInterval) { clearInterval(syncInterval);
                syncInterval = null; }

            await apiCall('/api/lobby/leave', {
                lobby_id: currentLobby,
                player: playerName
            });

            currentLobby = null;
            isInLobby = false;
            isHost = false;

            closeLobbyUI();
            showOnlineUI();
            showMessage('🚪 Вы вышли из лобби');
        }

        async function updateLobbyUI() {
            if (!currentLobby) return;

            const result = await apiGet('/api/lobby/get/' + currentLobby);
            if (result.error) {
                closeLobbyUI();
                showMessage('❌ Лобби удалено');
                if (syncInterval) { clearInterval(syncInterval);
                    syncInterval = null; }
                return;
            }

            const lobby = result;

            const title = document.getElementById('lobby-title');
            if (title) title.textContent = '🏠 ' + lobby.name;
            const info = document.getElementById('lobby-info');
            if (info) info.textContent = '📊 ' + lobby.mode;

            const playersList = document.getElementById('lobby-players-list');
            if (playersList) {
                let playersHtml = '';
                lobby.players.forEach(p => {
                    const isHostPlayer = p === lobby.host;
                    const isMe = p === playerName;
                    playersHtml += `
                                <div class="lobby-player" style="${isMe ? 'border-left: 3px solid #ffd700;' : ''}">
                                    <span>${p} ${isHostPlayer ? '👑' : ''} ${isMe ? ' (Вы)' : ''}</span>
                                    <span class="${isHostPlayer ? 'host-badge' : 'ready-badge'}">
                                        ${isHostPlayer ? 'Хост' : '✅ Готов'}
                                    </span>
                                </div>
                            `;
                });

                const emptySlots = 2 - lobby.players.length;
                for (let i = 0; i < emptySlots; i++) {
                    playersHtml += `
                                <div class="lobby-player">
                                    <span style="color:rgba(255,255,255,0.2);">🔲 Свободно</span>
                                    <span class="waiting-badge">Ожидание...</span>
                                </div>
                            `;
                }
                playersList.innerHTML = playersHtml;
            }

            const statusText = document.getElementById('lobby-status-text');
            const startBtn = document.getElementById('lobby-start-btn');

            if (lobby.status === 'playing') {
                if (statusText) statusText.textContent = '⚽ Матч идёт...';
                if (startBtn) startBtn.style.display = 'none';
            } else if (lobby.players.length >= 2) {
                if (statusText) statusText.textContent = '✅ Все готовы!';
                if (startBtn) {
                    if (isHost) {
                        startBtn.style.display = 'block';
                        startBtn.textContent = '▶️ НАЧАТЬ МАТЧ';
                    } else {
                        startBtn.style.display = 'none';
                        if (statusText) statusText.textContent = '⏳ Ожидание хоста...';
                    }
                }
            } else {
                if (statusText) statusText.textContent = '⏳ Ожидание игроков... (' + lobby.players.length + '/2)';
                if (startBtn) startBtn.style.display = 'none';
            }
        }

        async function startOnlineMatch() {
            if (!currentLobby || !isHost) {
                showMessage('❌ Только хост может начать!');
                return;
            }

            const result = await apiCall('/api/lobby/start', {
                lobby_id: currentLobby
            });

            if (result.error) {
                showMessage('❌ ' + result.error);
                return;
            }

            const lobby = result.lobby;
            opponentName = lobby.players.find(p => p !== playerName) || 'Соперник';
            matchId = result.match_id;

            if (syncInterval) { clearInterval(syncInterval);
                syncInterval = null; }

            closeLobbyUI();
            showMessage('⚽ Матч начинается! Противник: ' + opponentName);
            isOnline = true;

            subscribeMatch(matchId);

            setTimeout(() => { startGame('online'); }, 500);
        }

        // ============================================================
        // ====== 8-НАПРАВЛЕННЫЙ ДЖОСТИК (ИСПРАВЛЕННЫЙ) ==============
        // ============================================================

        function setupJoystick() {
            const base = document.getElementById('joystick-base');
            const thumb = document.getElementById('joystick-thumb');
            const area = document.getElementById('joystick-area');

            if (!base || !thumb || !area) return;

            let touchId = null;

            function get8Direction(dx, dy) {
                const angle = Math.atan2(dy, dx);
                const deg = angle * 180 / Math.PI;

                // 8 направлений (НЕ инвертировано!)
                if (deg > -22.5 && deg <= 22.5) return { dx: 1, dy: 0 };
                if (deg > 22.5 && deg <= 67.5) return { dx: 1, dy: -1 };
                if (deg > 67.5 && deg <= 112.5) return { dx: 0, dy: -1 };
                if (deg > 112.5 && deg <= 157.5) return { dx: -1, dy: -1 };
                if (deg > 157.5 || deg <= -157.5) return { dx: -1, dy: 0 };
                if (deg > -157.5 && deg <= -112.5) return { dx: -1, dy: 1 };
                if (deg > -112.5 && deg <= -67.5) return { dx: 0, dy: 1 };
                if (deg > -67.5 && deg <= -22.5) return { dx: 1, dy: 1 };
                return { dx: 0, dy: 0 };
            }

            function handleMove(cx, cy) {
                const rect = base.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const maxDist = rect.width / 2 - 30;

                let dx = cx - centerX;
                let dy = centerY - cy; // ← ИСПРАВЛЕНО! (было cy - centerY, стало centerY - cy)

                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > maxDist) {
                    dx = dx / dist * maxDist;
                    dy = dy / dist * maxDist;
                }

                thumb.style.left = rect.width / 2 + dx - 25 + 'px';
                thumb.style.top = rect.height / 2 - dy - 25 + 'px';

                const deadZone = 0.15;
                const normX = dx / maxDist;
                const normY = dy / maxDist;

                let direction = { dx: 0, dy: 0 };

                if (Math.abs(normX) < deadZone && Math.abs(normY) < deadZone) {
                    direction = { dx: 0, dy: 0 };
                } else {
                    direction = get8Direction(normX, normY);
                }

                // Отправляем только если изменилось
                if (direction.dx !== lastDirection.dx || direction.dy !== lastDirection.dy) {
                    lastDirection = direction;

                    if (direction.dx === 0 && direction.dy === 0) {
                        sendStop();
                    } else {
                        sendMove(direction.dx, direction.dy);
                    }
                }
            }

            function handleEnd() {
                thumb.style.left = '50%';
                thumb.style.top = '50%';
                thumb.style.transform = 'translate(-50%, -50%)';

                lastDirection = { dx: 0, dy: 0 };
                sendStop();
            }

            // Очищаем старые слушатели (если были)
            const newArea = area.cloneNode(true);
            area.parentNode.replaceChild(newArea, area);

            // Навешиваем на новый элемент
            const newBase = document.getElementById('joystick-base');
            const newThumb = document.getElementById('joystick-thumb');

            newArea.addEventListener('touchstart', e => {
                e.preventDefault();
                touchId = e.changedTouches[0].identifier;
                handleMove(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }, { passive: false });

            newArea.addEventListener('touchmove', e => {
                e.preventDefault();
                for (let t of e.changedTouches) {
                    if (t.identifier === touchId) {
                        handleMove(t.clientX, t.clientY);
                    }
                }
            }, { passive: false });

            newArea.addEventListener('touchend', e => {
                for (let t of e.changedTouches) {
                    if (t.identifier === touchId) {
                        handleEnd();
                    }
                }
            }, { passive: false });

            newArea.addEventListener('touchcancel', handleEnd, { passive: false });

            let mouseDown = false;
            newArea.addEventListener('mousedown', e => { mouseDown = true;
                handleMove(e.clientX, e.clientY); });
            document.addEventListener('mousemove', e => { if (mouseDown) handleMove(e.clientX, e.clientY); });
            document.addEventListener('mouseup', () => { if (mouseDown) { mouseDown = false;
                    handleEnd(); } });
        }

        // ============================================================
        // ====== ОТПРАВКА ДЕЙСТВИЙ ===================================
        // ============================================================

        function sendMove(dx, dy) {
            if (!matchId || gameState !== 'playing') return;
            apiCall('/api/match/move', {
                match_id: matchId,
                player_name: playerName,
                direction: { dx, dy }
            }).catch(() => {});
        }

        function sendStop() {
            if (!matchId || gameState !== 'playing') return;
            apiCall('/api/match/stop', {
                match_id: matchId,
                player_name: playerName
            }).catch(() => {});
        }

        function sendShoot() {
            if (!matchId || gameState !== 'playing') return;
            apiCall('/api/match/shoot', {
                match_id: matchId,
                player_name: playerName,
                target_x: 1150,
                target_y: 350
            }).catch(() => {});
        }

        function sendTackle() {
            if (!matchId || gameState !== 'playing') return;
            apiCall('/api/match/tackle', {
                match_id: matchId,
                player_name: playerName
            }).catch(() => {});
        }

        // ============================================================
        // ====== КНОПКИ ==============================================
        // ============================================================

        function setupButtons() {
            const shootBtn = document.getElementById('btn-shoot');
            if (shootBtn) {
                const newShoot = shootBtn.cloneNode(true);
                shootBtn.parentNode.replaceChild(newShoot, shootBtn);
                newShoot.addEventListener('touchstart', e => { e.preventDefault();
                    sendShoot(); });
                newShoot.addEventListener('mousedown', sendShoot);
            }

            const tackleBtn = document.getElementById('btn-tackle');
            if (tackleBtn) {
                const newTackle = tackleBtn.cloneNode(true);
                tackleBtn.parentNode.replaceChild(newTackle, tackleBtn);
                newTackle.addEventListener('touchstart', e => { e.preventDefault();
                    sendTackle(); });
                newTackle.addEventListener('mousedown', sendTackle);
            }

            // Клавиатура
            document.addEventListener('keydown', e => {
                if (gameState === 'playing') {
                    if (e.key === ' ') { e.preventDefault();
                        sendShoot(); }
                    if (e.key === 'q') sendTackle();
                    if (e.key === 'Escape') leaveMatch();
                }
            });
        }

        // ============================================================
        // ====== ВЫХОД ИЗ МАТЧА ======================================
        // ============================================================

        async function leaveMatch() {
            if (!matchId) return;

            await apiCall('/api/match/leave', {
                match_id: matchId
            });

            matchId = null;
            isOnline = false;
            matchFinished = true;

            gameState = 'menu';
            document.getElementById('menu-container').style.display = 'block';
            document.getElementById('joystick-area').style.display = 'none';
            document.getElementById('action-buttons').style.display = 'none';
            document.getElementById('score-display').style.display = 'none';
            document.getElementById('timer-display').style.display = 'none';
            document.getElementById('statusBar').style.display = 'none';
            document.getElementById('online-status').style.display = 'none';
            document.getElementById('exit-match-btn').style.display = 'none';
            updateUI();
            showMessage('🚪 Вы вышли из матча');
        }

        // ============================================================
        // ====== ИГРОВОЙ ДВИЖОК ======================================
        // ============================================================

        window.onload = function() {
            canvas = document.getElementById('gameCanvas');
            if (!canvas) { console.error('❌ Canvas не найден!'); return; }
            ctx = canvas.getContext('2d');
            if (!ctx) { console.error('❌ Не удалось получить контекст!'); return; }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            loadSave();
            updateUI();
            initSocket();
            setupJoystick();
            setupButtons();
            gameLoop();

            console.log('🚀 Игра загружена!');
            console.log('🌐 Сервер:', SERVER_URL);
            console.log('👤 Игрок:', playerName || 'Гость');
        };

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function updateGameFromState(state) {
            if (!state) return;

            if (state.score) {
                homeScore = state.score.home || 0;
                awayScore = state.score.away || 0;
                const scoreDisplay = document.getElementById('score-display');
                if (scoreDisplay) scoreDisplay.textContent = homeScore + ' : ' + awayScore;
            }

            if (state.time !== undefined) {
                gameTime = state.time;
                const remaining = Math.max(0, 300 - gameTime);
                const mins = Math.floor(remaining / 60);
                const secs = Math.floor(remaining % 60);
                const timerDisplay = document.getElementById('timer-display');
                if (timerDisplay) timerDisplay.textContent = '⏱️ ' + mins + ':' + String(secs).padStart(2, '0');
            }

            if (state.players) {
                localPlayers = {};
                for (let name in state.players) {
                    const p = state.players[name];
                    localPlayers[name] = {
                        x: p.x || 0,
                        y: p.y || 0,
                        team: p.team || 'home',
                        hasBall: p.hasBall || false,
                        name: name,
                        isPlayer: name === playerName
                    };
                }
            }

            if (state.ball) {
                localBall = { x: state.ball.x || 600, y: state.ball.y || 350 };
            }

            if (state.status === 'finished') {
                endMatch();
            }
        }

        function startGame(type) {
            isOnline = type === 'online';
            gameState = 'playing';
            document.getElementById('menu-container').style.display = 'none';
            document.getElementById('joystick-area').style.display = 'block';
            document.getElementById('action-buttons').style.display = 'flex';
            document.getElementById('score-display').style.display = 'block';
            document.getElementById('timer-display').style.display = 'block';
            document.getElementById('statusBar').style.display = 'block';
            document.getElementById('ratingDisplay').style.display = 'block';
            document.getElementById('exit-match-btn').style.display = 'block';

            if (isOnline) {
                document.getElementById('online-status').style.display = 'block';
                document.getElementById('online-status').textContent = '🌐 ' + opponentName;
                document.getElementById('statusBar').textContent = '⚽ Онлайн матч!';
            }

            homeScore = 0;
            awayScore = 0;
            gameTime = 0;
            matchFinished = false;
            document.getElementById('score-display').textContent = '0 : 0';

            if (isOnline && matchId) {
                apiGet('/api/match/state/' + matchId).then(r => {
                    if (!r.error) updateGameFromState(r);
                });
            }
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (gameState !== 'playing' || matchFinished) return;
            if (isOnline && matchId) {
                apiGet('/api/match/state/' + matchId).then(r => {
                    if (!r.error) updateGameFromState(r);
                }).catch(() => {});
            }
        }

        function render() {
            if (!canvas || !ctx) return;
            const w = canvas.width,
                h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            // На весь экран!
            const scale = Math.min(w / 1200, h / 700);
            const ox = (w - 1200 * scale) / 2;
            const oy = (h - 700 * scale) / 2;

            ctx.save();
            ctx.translate(ox, oy);
            ctx.scale(scale, scale);

            // Поле
            ctx.fillStyle = '#1b4332';
            ctx.fillRect(0, 0, 1200, 700);

            // Разметка
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 2;
            ctx.strokeRect(40, 40, 1120, 620);
            ctx.beginPath();
            ctx.arc(600, 350, 80, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(600, 40);
            ctx.lineTo(600, 660);
            ctx.stroke();
            ctx.strokeRect(40, 250, 120, 200);
            ctx.strokeRect(1040, 250, 120, 200);
            ctx.strokeRect(40, 290, 60, 120);
            ctx.strokeRect(1100, 290, 60, 120);

            // Ворота
            ctx.fillStyle = 'rgba(255,255,255,0.04)';
            ctx.fillRect(25, 260, 30, 180);
            ctx.fillRect(1145, 260, 30, 180);
            ctx.strokeStyle = 'rgba(255,255,255,0.25)';
            ctx.lineWidth = 3;
            ctx.strokeRect(25, 260, 30, 180);
            ctx.strokeRect(1145, 260, 30, 180);

            // Мяч
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(localBall.x || 600, localBall.y || 350, 10, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Игроки
            for (let name in localPlayers) {
                const p = localPlayers[name];
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 18, 0, Math.PI * 2);
                if (p.isPlayer) {
                    const grad = ctx.createRadialGradient(p.x - 5, p.y - 5, 3, p.x, p.y, 18);
                    grad.addColorStop(0, '#ffd700');
                    grad.addColorStop(1, '#e6a800');
                    ctx.fillStyle = grad;
                } else {
                    ctx.fillStyle = p.team === 'home' ? '#00b4d8' : '#e63946';
                }
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'white';
                ctx.font = 'bold 9px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(name, p.x, p.y - 28);

                if (p.hasBall) {
                    ctx.shadowColor = 'rgba(255,215,0,0.3)';
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                if (p.isPlayer) {
                    ctx.shadowColor = '#ffd700';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255,215,0,0.2)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }

            ctx.restore();

            if (gameState === 'playing') {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(w / 2 - 45, 6, 90, 28);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(homeScore + ' : ' + awayScore, w / 2, 27);
            }
        }

        function endMatch() {
            if (matchFinished) return;
            matchFinished = true;
            const isWin = homeScore > awayScore;

            if (playerName && isOnline) {
                if (isWin) {
                    playerCrystals += 30 + homeScore * 5;
                    showMessage('🏆 ПОБЕДА! +' + (30 + homeScore * 5) + '💎');
                } else {
                    playerCrystals += 10;
                    showMessage('💔 ПОРАЖЕНИЕ +10💎');
                }
                saveGame();
                updateUI();
            }

            document.getElementById('statusBar').textContent = '🏁 ' + (isWin ? 'Победа!' : 'Поражение');

            setTimeout(() => {
                document.getElementById('exit-match-btn').style.display = 'none';
                gameState = 'menu';
                document.getElementById('menu-container').style.display = 'block';
                document.getElementById('joystick-area').style.display = 'none';
                document.getElementById('action-buttons').style.display = 'none';
                document.getElementById('score-display').style.display = 'none';
                document.getElementById('timer-display').style.display = 'none';
                document.getElementById('statusBar').style.display = 'none';
                document.getElementById('online-status').style.display = 'none';
                isOnline = false;
                updateUI();
            }, 2500);
        }

        function showMessage(text) {
            const el = document.getElementById('message');
            if (!el) return;
            el.textContent = text;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 2500);
        }

        console.log('⚽ STREET FOOTBALL 1x1 v23.0 загружена!');
        console.log('🌐 Сервер:', SERVER_URL);
        console.log('👤 Игрок:', playerName || 'Гость');
        console.log('🎮 Джостик исправлен!');
    </script>
</body>
</html>
