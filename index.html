<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚽ STREET FOOTBALL - 1x1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: #0d1b2a;
            font-family: Arial, sans-serif;
            color: white;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #1b4332;
            image-rendering: pixelated;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .btn {
            pointer-events: auto;
            background: rgba(60, 60, 80, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.2s;
            touch-action: manipulation;
            width: 100%;
            text-align: center;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-blue {
            background: rgba(50, 100, 255, 0.7);
            border-color: #4d7aff;
        }
        .btn-red {
            background: rgba(200, 50, 50, 0.7);
            border-color: #ff6b6b;
        }
        .btn-green {
            background: rgba(0, 200, 100, 0.7);
            border-color: #51cf66;
        }
        .btn-gray {
            background: rgba(100, 100, 120, 0.7);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .btn-orange {
            background: rgba(255, 150, 50, 0.7);
            border-color: #ffa94d;
        }
        #menu-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            width: 94%;
            max-width: 440px;
            max-height: 95vh;
            overflow-y: auto;
        }
        #menu-container .title {
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            margin-bottom: 6px;
        }
        #menu-container .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            margin-bottom: 10px;
        }
        .btn-full {
            margin: 4px 0;
            padding: 10px;
            font-size: 14px;
        }
        #score-display {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 18px;
            border-radius: 10px;
            pointer-events: none;
            z-index: 20;
            display: none;
        }
        #timer-display {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.5);
            padding: 3px 10px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 20;
            display: none;
        }
        #statusBar {
            position: absolute;
            top: 55px;
            left: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 10px;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 8px;
            border-radius: 6px;
            display: none;
        }
        #ratingDisplay {
            position: absolute;
            top: 55px;
            right: 10px;
            color: #ffd700;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 8px;
            border-radius: 6px;
            display: none;
        }
        #online-status {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            color: #51cf66;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 12px;
            border-radius: 6px;
            display: none;
        }
        #joystick-area {
            position: absolute;
            bottom: 70px;
            left: 15px;
            width: 120px;
            height: 120px;
            pointer-events: auto;
            z-index: 30;
            display: none;
            touch-action: none;
        }
        #joystick-base {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            border: 3px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
        }
        #joystick-thumb {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, 0.6), rgba(200, 200, 200, 0.3));
            border: 2px solid rgba(255, 255, 255, 0.3);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            transition: none;
            pointer-events: none;
        }
        #joystick-center-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #action-buttons {
            position: absolute;
            bottom: 70px;
            right: 15px;
            display: none;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            z-index: 30;
        }
        .action-btn {
            pointer-events: auto;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            touch-action: manipulation;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .action-btn:active {
            transform: scale(0.92);
        }
        .btn-shoot {
            background: radial-gradient(circle at 40% 35%, rgba(255, 80, 80, 0.8), rgba(200, 30, 30, 0.6));
            border-color: rgba(255, 100, 100, 0.5);
        }
        .btn-tackle {
            background: radial-gradient(circle at 40% 35%, rgba(80, 80, 255, 0.8), rgba(30, 30, 200, 0.6));
            border-color: rgba(100, 100, 255, 0.5);
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            background: rgba(0, 0, 0, 0.8);
            padding: 14px 28px;
            border-radius: 14px;
            pointer-events: none;
            z-index: 40;
            display: none;
            text-align: center;
            max-width: 90%;
        }
        #lobby-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 95;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #lobby-container {
            background: rgba(13, 27, 42, 0.95);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
        }
        #lobby-container h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 8px;
            font-size: 20px;
        }
        .lobby-info {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 12px;
        }
        .lobby-players {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
        }
        .lobby-player {
            padding: 6px 10px;
            margin: 3px 0;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .lobby-player .host-badge {
            color: #ffd700;
            font-size: 11px;
        }
        .lobby-player .ready-badge {
            color: #51cf66;
            font-size: 11px;
        }
        .lobby-player .waiting-badge {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
        }
        #create-lobby-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 92;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #create-lobby-container {
            background: rgba(13, 27, 42, 0.95);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
        }
        #create-lobby-container h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 12px;
            font-size: 20px;
        }
        #create-lobby-container input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.06);
            color: white;
            font-size: 14px;
            pointer-events: auto;
            outline: none;
        }
        #create-lobby-container input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }
        #create-lobby-container input:focus {
            border-color: #ffd700;
        }
        .mode-select {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .mode-select .btn {
            flex: 1;
            padding: 8px;
            font-size: 13px;
        }
        .mode-select .btn.active {
            background: rgba(255, 215, 0, 0.3) !important;
            border-color: #ffd700 !important;
        }
        #find-lobby-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 93;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #find-lobby-container {
            background: rgba(13, 27, 42, 0.95);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
        }
        #find-lobby-container h2 {
            color: #4d7aff;
            text-align: center;
            margin-bottom: 12px;
            font-size: 20px;
        }
        .lobby-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .lobby-item .lobby-info-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .lobby-item .lobby-name {
            font-weight: bold;
            font-size: 14px;
        }
        .lobby-item .lobby-desc {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }
        .lobby-item .join-btn {
            background: rgba(81, 207, 102, 0.2);
            border: 1px solid rgba(81, 207, 102, 0.3);
            border-radius: 8px;
            padding: 6px 16px;
            color: #51cf66;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            pointer-events: auto !important;
            z-index: 100;
        }
        .lobby-item .join-btn:active {
            transform: scale(0.95);
            background: rgba(81, 207, 102, 0.4);
        }
        .refresh-btn {
            margin-bottom: 10px;
        }
        #online-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 90;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #online-container {
            background: rgba(13, 27, 42, 0.95);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
        }
        #online-container h2 {
            color: #4d7aff;
            text-align: center;
            margin-bottom: 8px;
            font-size: 22px;
        }
        .online-status-text {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 12px;
            min-height: 24px;
        }
        .online-btn {
            margin: 4px 0;
        }
        .close-online {
            margin-top: 12px;
        }
        #login-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(13, 27, 42, 0.95);
            border-radius: 16px;
            padding: 20px;
            width: 92%;
            max-width: 380px;
            z-index: 60;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #login-container h2 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 18px;
        }
        #login-container input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.06);
            color: white;
            font-size: 14px;
            pointer-events: auto;
            outline: none;
        }
        #login-container input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }
        #login-container input:focus {
            border-color: #ffd700;
        }
        #login-container .btn {
            margin: 3px 0;
        }
        #loginMsg {
            text-align: center;
            margin-top: 6px;
            font-size: 12px;
            min-height: 18px;
        }
        .login-success {
            color: #51cf66 !important;
        }
        .login-error {
            color: #ff6b6b !important;
        }
        #exit-match-btn {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            z-index: 50;
            display: none;
            font-size: 12px;
            padding: 8px;
        }
        @media(max-width:600px) {
            #joystick-area {
                width: 100px;
                height: 100px;
                bottom: 60px;
                left: 10px;
            }
            #joystick-base {
                width: 100px;
                height: 100px;
            }
            #joystick-thumb {
                width: 42px;
                height: 42px;
            }
            .action-btn {
                width: 50px;
                height: 50px;
                font-size: 10px;
            }
            #action-buttons {
                gap: 8px;
                bottom: 60px;
                right: 10px;
            }
            #menu-container .title {
                font-size: 22px;
            }
            #score-display {
                font-size: 22px;
                padding: 2px 14px;
            }
            .btn {
                font-size: 12px;
                padding: 8px 10px;
            }
            .lobby-item {
                flex-wrap: wrap;
                gap: 8px;
            }
            .lobby-item .join-btn {
                width: 100%;
                text-align: center;
            }
            #exit-match-btn {
                width: 130px;
                font-size: 11px;
                padding: 6px;
            }
        }
        @media(max-width:400px) {
            #joystick-area {
                width: 80px;
                height: 80px;
                bottom: 50px;
                left: 8px;
            }
            #joystick-base {
                width: 80px;
                height: 80px;
            }
            #joystick-thumb {
                width: 34px;
                height: 34px;
            }
            .action-btn {
                width: 44px;
                height: 44px;
                font-size: 9px;
            }
            #action-buttons {
                gap: 6px;
                bottom: 50px;
                right: 8px;
            }
            #score-display {
                font-size: 18px;
                padding: 2px 10px;
            }
            #timer-display {
                font-size: 12px;
                padding: 2px 8px;
            }
            .btn {
                font-size: 11px;
                padding: 6px 8px;
            }
            #exit-match-btn {
                width: 100px;
                font-size: 10px;
                padding: 4px;
            }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-overlay">
        <!-- Счет и таймер -->
        <div id="score-display">0 : 0</div>
        <div id="timer-display">⏱️ 5:00</div>
        <div id="statusBar">⚽ Добро пожаловать!</div>
        <div id="ratingDisplay">⭐ 50</div>
        <div id="online-status"></div>

        <!-- МЕНЮ -->
        <div id="menu-container">
            <div class="title">⚽ STREET<br>FOOTBALL</div>
            <div class="subtitle" id="playerInfo">👤 Гость | ⭐ 50 | 💎 100</div>
            <button class="btn btn-orange btn-full" onclick="showOnlineUI()">🌐 ОНЛАЙН</button>
            <div id="guestMenu">
                <button class="btn btn-blue btn-full" onclick="showLogin()">🔑 Войти</button>
                <button class="btn btn-blue btn-full" onclick="showRegister()">📝 Регистрация</button>
            </div>
        </div>

        <!-- ЛОГИН -->
        <div id="login-container">
            <h2 id="loginTitle">🔑 Вход</h2>
            <input type="text" id="loginName" placeholder="Имя игрока">
            <input type="password" id="loginPass" placeholder="Пароль">
            <button class="btn btn-blue" onclick="handleLogin()">✅ Войти</button>
            <button class="btn btn-gray" onclick="closeLogin()">↩️ Назад</button>
            <div id="loginMsg"></div>
        </div>

        <!-- ОНЛАЙН МЕНЮ -->
        <div id="online-overlay">
            <div id="online-container">
                <h2>🌐 ОНЛАЙН</h2>
                <div class="online-status-text" id="online-status-text">⚡ Выберите действие</div>
                <button class="btn btn-green online-btn" onclick="showCreateLobbyUI()">🏠 СОЗДАТЬ ЛОББИ</button>
                <button class="btn btn-blue online-btn" onclick="showFindLobbyUI()">🔍 НАЙТИ ЛОББИ</button>
                <button class="btn btn-gray" onclick="closeOnlineUI()">↩️ Назад</button>
            </div>
        </div>

        <!-- СОЗДАНИЕ ЛОББИ -->
        <div id="create-lobby-overlay">
            <div id="create-lobby-container">
                <h2>🏠 СОЗДАНИЕ ЛОББИ</h2>
                <input type="text" id="lobbyNameInput" placeholder="Название лобби">
                <div class="mode-select">
                    <button class="btn active" onclick="selectLobbyMode('1x1', this)">⚔️ 1x1</button>
                    <button class="btn" onclick="selectLobbyMode('2x2', this)">⚔️ 2x2</button>
                </div>
                <button class="btn btn-green" onclick="createLobby()">✅ СОЗДАТЬ</button>
                <button class="btn btn-gray" onclick="closeCreateLobbyUI()">↩️ Назад</button>
                <div id="create-lobby-msg"></div>
            </div>
        </div>

        <!-- ПОИСК ЛОББИ -->
        <div id="find-lobby-overlay">
            <div id="find-lobby-container">
                <h2>🔍 ПОИСК ЛОББИ</h2>
                <button class="btn btn-blue refresh-btn" onclick="findLobbies()">🔄 Обновить</button>
                <div id="lobby-list"></div>
                <button class="btn btn-gray" onclick="closeFindLobbyUI()">↩️ Назад</button>
            </div>
        </div>

        <!-- ЛОББИ -->
        <div id="lobby-overlay">
            <div id="lobby-container">
                <h2 id="lobby-title">🏠 ЛОББИ</h2>
                <div class="lobby-info" id="lobby-info">📊 Режим: 1x1</div>
                <div class="lobby-players" id="lobby-players-list"></div>
                <div class="lobby-info" id="lobby-status-text">⏳ Ожидание игроков...</div>
                <button class="btn btn-green" id="lobby-start-btn" onclick="startOnlineMatch()" style="display:none;">▶️ НАЧАТЬ МАТЧ</button>
                <button class="btn btn-red" onclick="leaveLobby()">🚪 ВЫЙТИ</button>
                <div id="lobby-msg"></div>
            </div>
        </div>

        <!-- СООБЩЕНИЕ -->
        <div id="message"></div>

        <!-- УПРАВЛЕНИЕ -->
        <div id="joystick-area">
            <div id="joystick-base">
                <div id="joystick-thumb"></div>
                <div id="joystick-center-dot"></div>

        async function apiCall(endpoint, data) {
            try {
                const res = await fetch(SERVER_URL + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return await res.json();
            } catch (e) {
                return { error: 'Ошибка соединения' };
            }
        }

        async function apiGet(endpoint) {
            try {
                const res = await fetch(SERVER_URL + endpoint);
                return await res.json();
            } catch (e) {
                return { error: 'Ошибка соединения' };
            }
        }

        function loadSave() {
            try {
                const data = localStorage.getItem('football_save');
                if (data) {
                    const save = JSON.parse(data);
                    playerName = save.name || '';
                    playerRating = save.rating || 50;
                    playerCrystals = save.crystals || 100;
                }
            } catch (e) {}
        }

        function saveGame() {
            localStorage.setItem('football_save', JSON.stringify({
                name: playerName,
                rating: playerRating,
                crystals: playerCrystals
            }));
        }

            if (!info) return;

            if (playerName) {
                info.textContent = '👤 ' + playerName + ' | ⭐ ' + playerRating + ' | 💎 ' + playerCrystals;
                const guestMenu = document.getElementById('guestMenu');
                if (guestMenu) guestMenu.style.display = 'none';
            } else {
                info.textContent = '👤 Гость | ⭐ 50 | 💎 100';
                const guestMenu = document.getElementById('guestMenu');
                if (guestMenu) guestMenu.style.display = 'block';
            }
            const ratingDisplay = document.getElementById('ratingDisplay');
            if (ratingDisplay) ratingDisplay.textContent = '⭐ ' + playerRating;
        }

            document.querySelectorAll('#create-lobby-container .mode-select .btn').forEach(b => b.classList.remove('active'));

            if (first) first.classList.add('active');
            lobbyMode = '1x1';
        }

            const el = document.getElementById('create-lobby-overlay');
            if (el) el.style.display = 'none';
            showOnlineUI();
