<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ STREET FOOTBALL LEGENDS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            background: #0d1b2a;
            overflow: hidden;
            font-family: Arial, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
            color: white;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #1b4332;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .btn {
            pointer-events: auto;
            background: rgba(60, 60, 80, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.2s;
            touch-action: manipulation;
            width: 100%;
            text-align: center;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn.active {
            background: rgba(255, 215, 0, 0.85) !important;
            border-color: #ffd700 !important;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            color: #1a1a2e !important;
        }
        .btn-blue {
            background: rgba(50, 100, 255, 0.7);
            border-color: #4d7aff;
        }
        .btn-red {
            background: rgba(200, 50, 50, 0.7);
            border-color: #ff6b6b;
        }
        .btn-gold {
            background: rgba(200, 150, 50, 0.7);
            border-color: #ffd700;
        }
        .btn-green {
            background: rgba(0, 200, 100, 0.7);
            border-color: #51cf66;
        }
        .btn-purple {
            background: rgba(150, 50, 200, 0.7);
            border-color: #b197fc;
        }
        .btn-gray {
            background: rgba(100, 100, 120, 0.7);
            border-color: rgba(255, 255, 255, 0.2);
        }
        #menu-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            width: 94%;
            max-width: 440px;
            max-height: 95vh;
            overflow-y: auto;
        }
        #menu-container .title {
            color: white;
            font-size: 30px;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            margin-bottom: 8px;
        }
        #menu-container .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            margin-bottom: 12px;
        }
        .menu-section {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .menu-section .section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .row-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .row-buttons .btn {
            flex: 1;
            min-width: 60px;
            padding: 8px 10px;
            font-size: 12px;
        }
        .btn-full {
            margin: 4px 0;
            padding: 12px;
            font-size: 15px;
        }
        #score-display {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 18px;
            border-radius: 10px;
            pointer-events: none;
            z-index: 20;
            display: none;
        }
        #timer-display {
            position: absolute;
            top: 12px;
            right: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 12px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 20;
            display: none;
        }
        #statusBar {
            position: absolute;
            top: 60px;
            left: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 3px 10px;
            border-radius: 6px;
            display: none;
        }
        #ratingDisplay {
            position: absolute;
            top: 60px;
            right: 10px;
            color: #ffd700;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 3px 10px;
            border-radius: 6px;
            display: none;
        }
        #controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 10px;
            pointer-events: none;
            z-index: 30;
        }
        .ctrl-btn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            touch-action: manipulation;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .ctrl-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.92);
        }
        #dpad {
            position: relative;
            width: 140px;
            height: 140px;
            pointer-events: none;
        }
        .dpad-btn {
            position: absolute;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            touch-action: manipulation;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .dpad-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.90);
        }
        #dpad-up {
            top: 0;
            left: 48px;
        }
        #dpad-down {
            bottom: 0;
            left: 48px;
        }
        #dpad-left {
            top: 48px;
            left: 0;
        }
        #dpad-right {
            top: 48px;
            right: 0;
        }
        #action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        #action-buttons .ctrl-btn {
            width: 68px;
            height: 68px;
            font-size: 12px;
            border-radius: 50%;
        }
        .btn-shoot {
            background: rgba(255, 50, 50, 0.6);
            border-color: #ff6b6b;
        }
        .btn-pass {
            background: rgba(50, 200, 50, 0.6);
            border-color: #51cf66;
        }
        .btn-tackle {
            background: rgba(50, 50, 200, 0.6);
            border-color: #5c7cfa;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            background: rgba(0, 0, 0, 0.8);
            padding: 16px 30px;
            border-radius: 14px;
            pointer-events: none;
            z-index: 40;
            display: none;
            text-align: center;
            max-width: 90%;
        }
        #leaderboard {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(13, 27, 42, 0.95);
            border-radius: 16px;
            padding: 18px;
            width: 92%;
            max-width: 420px;
            max-height: 80vh;
            overflow-y: auto;
            pointer-events: auto;
            z-index: 50;
            display: none;
            color: white;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #leaderboard h2 {
            text-align: center;
            margin-bottom: 12px;
            color: #ffd700;
            font-size: 20px;
        }
        #leaderboard .entry {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 14px;
        }
        #leaderboard .entry .rank {
            color: #ffd700;
            font-weight: bold;
            width: 28px;
        }
        #leaderboard .entry .name {
            flex: 1;
            padding: 0 8px;
        }
        #leaderboard .entry .rating {
            color: #ffd700;
        }
        #leaderboard .entry .wins {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }
        .close-btn {
            margin-top: 12px;
        }
        #login-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(13, 27, 42, 0.95);
            border-radius: 16px;
            padding: 22px;
            width: 92%;
            max-width: 380px;
            z-index: 60;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #login-container h2 {
            color: white;
            text-align: center;
            margin-bottom: 12px;
            font-size: 20px;
        }
        #login-container input {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 15px;
            pointer-events: auto;
            outline: none;
        }
        #login-container input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        #login-container input:focus {
            border-color: #ffd700;
        }
        #login-container .btn {
            margin: 4px 0;
        }
        #loginMsg {
            text-align: center;
            margin-top: 8px;
            font-size: 13px;
            min-height: 20px;
        }
        .login-success {
            color: #51cf66 !important;
        }
        .login-error {
            color: #ff6b6b !important;
        }
        @media(max-width:600px) {
            .ctrl-btn {
                width: 52px;
                height: 52px;
                font-size: 16px;
            }
            #action-buttons .ctrl-btn {
                width: 58px;
                height: 58px;
                font-size: 11px;
            }
            #dpad {
                width: 120px;
                height: 120px;
            }
            .dpad-btn {
                width: 38px;
                height: 38px;
                font-size: 16px;
            }
            #dpad-up {
                left: 41px;
            }
            #dpad-down {
                left: 41px;
            }
            #dpad-left {
                top: 41px;
            }
            #dpad-right {
                top: 41px;
            }
            #menu-container .title {
                font-size: 24px;
            }
            #score-display {
                font-size: 20px;
                padding: 3px 12px;
            }
            .btn {
                font-size: 12px;
                padding: 8px 12px;
            }
            .row-buttons .btn {
                font-size: 11px;
                padding: 6px 8px;
                min-width: 50px;
            }
            #menu-container .subtitle {
                font-size: 11px;
            }
            .menu-section {
                padding: 8px 10px;
            }
        }
        @media(max-width:400px) {
            .ctrl-btn {
                width: 44px;
                height: 44px;
                font-size: 13px;
            }
            #action-buttons .ctrl-btn {
                width: 50px;
                height: 50px;
                font-size: 10px;
            }
            #dpad {
                width: 100px;
                height: 100px;
            }
            .dpad-btn {
                width: 32px;
                height: 32px;
                font-size: 13px;
            }
            #dpad-up {
                left: 34px;
            }
            #dpad-down {
                left: 34px;
            }
            #dpad-left {
                top: 34px;
            }
            #dpad-right {
                top: 34px;
            }
            #score-display {
                font-size: 17px;
                padding: 2px 10px;
            }
            #timer-display {
                font-size: 14px;
                padding: 2px 8px;
            }
            .btn {
                font-size: 11px;
                padding: 6px 10px;
            }
            .row-buttons .btn {
                font-size: 10px;
                padding: 5px 6px;
                min-width: 40px;
            }
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-overlay">
        <div id="score-display">0 : 0</div>
        <div id="timer-display">⏱️ 5:00</div>
        <div id="statusBar">⚽ Добро пожаловать!</div>
        <div id="ratingDisplay">⭐ 50</div>

        <!-- МЕНЮ -->
        <div id="menu-container">
            <div class="title">⚽ STREET<br>FOOTBALL</div>
            <div class="subtitle" id="playerInfo">👤 Гость | ⭐ 50 | 💎 100</div>

            <!-- Режимы -->
            <div class="menu-section">
                <div class="section-title">🎮 Режим игры</div>
                <div class="row-buttons">
                    <button class="btn active" id="mode2x2">2x2</button>
                    <button class="btn" id="mode3x3">3x3</button>
                </div>
            </div>

            <!-- Сложность -->
            <div class="menu-section">
                <div class="section-title">⚡ Сложность</div>
                <div class="row-buttons">
                    <button class="btn active" id="diffEasy">🟢 Лёгкий</button>
                    <button class="btn" id="diffMedium">🟡 Средний</button>
                    <button class="btn" id="diffHard">🔴 Сложный</button>
                </div>
            </div>

            <!-- Основные кнопки (видны всем) -->
            <button class="btn btn-green btn-full" onclick="startGame()">⚔️ НАЧАТЬ МАТЧ</button>

            <!-- Меню для гостей -->
            <div id="guestMenu">
                <button class="btn btn-blue btn-full" onclick="showLogin()">🔑 Войти</button>
                <button class="btn btn-purple btn-full" onclick="showRegister()">📝 Регистрация</button>
            </div>

            <!-- Меню для авторизованных -->
            <div id="userMenu" style="display:none;">
                <button class="btn btn-gold btn-full" onclick="showPacks()">📦 ПАКИ И СКИНЫ</button>
                <button class="btn btn-blue btn-full" onclick="showOnlineMenu()">🌐 ОНЛАЙН</button>
            </div>

            <button class="btn btn-gold btn-full" onclick="showLeaderboard()">📊 Рейтинг</button>
        </div>

        <!-- ЛОГИН/РЕГИСТРАЦИЯ -->
        <div id="login-container">
            <h2 id="loginTitle">🔑 Вход</h2>
            <input type="text" id="loginName" placeholder="Имя игрока">
            <input type="password" id="loginPass" placeholder="Пароль">
            <button class="btn btn-blue" onclick="handleLogin()">✅ Войти</button>
            <button class="btn btn-gray" onclick="closeLogin()">↩️ Назад</button>
            <div id="loginMsg"></div>
        </div>

        <!-- ТАБЛИЦА РЕЙТИНГОВ -->
        <div id="leaderboard">
            <h2>🏆 ТАБЛИЦА РЕЙТИНГОВ</h2>
            <div id="leaderboard-list"></div>
            <button class="btn btn-gray close-btn" onclick="closeLeaderboard()">↩️ Назад</button>
        </div>

        <!-- СООБЩЕНИЕ -->
        <div id="message"></div>

        <!-- УПРАВЛЕНИЕ -->
        <div id="controls">
            <div id="dpad">
                <div class="dpad-btn" id="dpad-up">▲</div>
                <div class="dpad-btn" id="dpad-down">▼</div>
                <div class="dpad-btn" id="dpad-left">◄</div>
                <div class="dpad-btn" id="dpad-right">►</div>
            </div>
            <div id="action-buttons">
                <button class="ctrl-btn btn-shoot" id="btn-shoot">⚽ Удар</button>
                <button class="ctrl-btn btn-pass" id="btn-pass">🎯 Пас</button>
                <button class="ctrl-btn btn-tackle" id="btn-tackle">🛡️ Отбор</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // ==================== ВСЯ ИГРА ===============================
        // ============================================================

        // ---- КОНСТАНТЫ ----
        const FIELD_W = 1200,
            FIELD_H = 700;
        const PLAYER_RADIUS = 20,
            BALL_RADIUS = 12;
        const GOAL_WIDTH = 20,
            GOAL_HEIGHT = 120;
        const MATCH_TIME = 300;

        // ---- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ----
        let canvas, ctx;
        let gameState = 'menu';
        let mode = '2x2';
        let difficulty = 'easy';
        let playerName = '';
        let playerRating = 50;
        let playerCrystals = 100;
        let playerWins = 0,
            playerMatches = 0,
            playerGoals = 0;

        // Инвентарь скинов {slot: skinName}
        let equippedSkins = { 1: 'Повязка', 2: 'Майка', 3: 'Шорты', 4: 'Кеды', 5: 'Нарукавник' };
        let ownedSkins = {};

        // Игровые объекты
        let ball = { x: 600, y: 350, vx: 0, vy: 0 };
        let players = [];
        let goalkeepers = [];
        let homeScore = 0,
            awayScore = 0;
        let gameTime = 0;
        let matchFinished = false;
        let goalCooldown = 0;

        // Управление
        let keys = { up: false, down: false, left: false, right: false };
        let touchControls = { shoot: false, pass: false, tackle: false };

        // ---- ЗАГРУЗКА СОХРАНЕНИЯ ----
        function loadSave() {
            try {
                const data = localStorage.getItem('football_save');
                if (data) {
                    const save = JSON.parse(data);
                    playerName = save.name || '';
                    playerRating = save.rating || 50;
                    playerCrystals = save.crystals || 100;
                    playerWins = save.wins || 0;
                    playerMatches = save.matches || 0;
                    playerGoals = save.goals || 0;
                    equippedSkins = save.equippedSkins || { 1: 'Повязка', 2: 'Майка', 3: 'Шорты', 4: 'Кеды', 5: 'Нарукавник' };
                    ownedSkins = save.ownedSkins || {};
                    // Проверяем рейтинг от скинов
                    recalcRating();
                }
            } catch (e) { console.log('Ошибка загрузки', e); }
        }

        function saveGame() {
            try {
                const data = {
                    name: playerName,
                    rating: playerRating,
                    crystals: playerCrystals,
                    wins: playerWins,
                    matches: playerMatches,
                    goals: playerGoals,
                    equippedSkins: equippedSkins,
                    ownedSkins: ownedSkins
                };
                localStorage.setItem('football_save', JSON.stringify(data));
            } catch (e) { console.log('Ошибка сохранения', e); }
        }

        // ---- СИСТЕМА РЕЙТИНГА ----
        const SKIN_DATA = {
            // Слот 1: Голова
            'Повязка': { slot: 1, rarity: 'common', rating: 0 },
            'Бандана': { slot: 1, rarity: 'uncommon', rating: 1 },
            'Шлем': { slot: 1, rarity: 'rare', rating: 2 },
            'Корона': { slot: 1, rarity: 'epic', rating: 5 },
            'Золотой шлем': { slot: 1, rarity: 'legendary', rating: 8 },
            'Нимб бога': { slot: 1, rarity: 'mythic', rating: 10 },
            // Слот 2: Торс
            'Майка': { slot: 2, rarity: 'common', rating: 0 },
            'Футболка': { slot: 2, rarity: 'uncommon', rating: 1 },
            'Броня': { slot: 2, rarity: 'rare', rating: 2 },
            'Латы': { slot: 2, rarity: 'epic', rating: 5 },
            'Золотая броня': { slot: 2, rarity: 'legendary', rating: 8 },
            'Доспехи бога': { slot: 2, rarity: 'mythic', rating: 10 },
            // Слот 3: Ноги
            'Шорты': { slot: 3, rarity: 'common', rating: 0 },
            'Наголенники': { slot: 3, rarity: 'uncommon', rating: 1 },
            'Щитки': { slot: 3, rarity: 'rare', rating: 2 },
            'Поножи': { slot: 3, rarity: 'epic', rating: 5 },
            'Золотые поножи': { slot: 3, rarity: 'legendary', rating: 8 },
            'Ноги бога': { slot: 3, rarity: 'mythic', rating: 10 },
            // Слот 4: Ботинки
            'Кеды': { slot: 4, rarity: 'common', rating: 0 },
            'Кроссовки': { slot: 4, rarity: 'uncommon', rating: 1 },
            'Бутсы': { slot: 4, rarity: 'rare', rating: 2 },
            'Молнии': { slot: 4, rarity: 'epic', rating: 5 },
            'Золотые бутсы': { slot: 4, rarity: 'legendary', rating: 8 },
            'Ботинки бога': { slot: 4, rarity: 'mythic', rating: 10 },
            // Слот 5: Аксессуар
            'Нарукавник': { slot: 5, rarity: 'common', rating: 0 },
            'Перчатки': { slot: 5, rarity: 'uncommon', rating: 1 },
            'Напульсник': { slot: 5, rarity: 'rare', rating: 2 },
            'Амулет': { slot: 5, rarity: 'epic', rating: 4 },
            'Золотой амулет': { slot: 5, rarity: 'legendary', rating: 7 },
            'Артефакт бога': { slot: 5, rarity: 'mythic', rating: 9 }
        };

        function recalcRating() {
            let rating = 50;
            for (let slot = 1; slot <= 5; slot++) {
                const skinName = equippedSkins[slot];
                if (skinName && SKIN_DATA[skinName]) {
                    rating += SKIN_DATA[skinName].rating;
                }
            }
            playerRating = Math.min(rating, 99);
            updateUI();
            saveGame();
        }

        // ---- ПАКИ ----
        const PACK_PRICES = { common: 100, rare: 300, epic: 800, legendary: 2000 };
        const PACK_DROPS = {
            common: { common: 60, uncommon: 30, rare: 10 },
            rare: { uncommon: 40, rare: 35, epic: 25 },
            epic: { rare: 30, epic: 45, legendary: 25 },
            legendary: { epic: 30, legendary: 50, mythic: 20 }
        };

        function openPack(packType) {
            if (playerCrystals < PACK_PRICES[packType]) {
                showMessage('❌ Недостаточно кристаллов!');
                return;
            }
            playerCrystals -= PACK_PRICES[packType];

            // Выбор редкости
            const drops = PACK_DROPS[packType];
            let total = 0;
            for (let k in drops) total += drops[k];
            let r = Math.random() * total;
            let rarity = 'common';
            for (let k in drops) {
                r -= drops[k];
                if (r <= 0) { rarity = k; break; }
            }

            // Выбор скина
            const skinsByRarity = {
                common: ['Повязка', 'Майка', 'Шорты', 'Кеды', 'Нарукавник'],
                uncommon: ['Бандана', 'Футболка', 'Наголенники', 'Кроссовки', 'Перчатки'],
                rare: ['Шлем', 'Броня', 'Щитки', 'Бутсы', 'Напульсник'],
                epic: ['Корона', 'Латы', 'Поножи', 'Молнии', 'Амулет'],
                legendary: ['Золотой шлем', 'Золотая броня', 'Золотые поножи', 'Золотые бутсы', 'Золотой амулет'],
                mythic: ['Нимб бога', 'Доспехи бога', 'Ноги бога', 'Ботинки бога', 'Артефакт бога']
            };
            const skinName = skinsByRarity[rarity][Math.floor(Math.random() * skinsByRarity[rarity].length)];

            // Добавляем в инвентарь
            if (!ownedSkins[skinName]) ownedSkins[skinName] = 0;
            ownedSkins[skinName]++;

            saveGame();
            recalcRating();

            const rarityNames = {
                common: '🟤 Обычный',
                uncommon: '🟢 Необычный',
                rare: '🔵 Редкий',
                epic: '🟣 Эпический',
                legendary: '🟠 Легендарный',
                mythic: '🔴 Мифический'
            };

            showMessage('🎉 Выпал: ' + rarityNames[rarity] + ' - ' + skinName + '! ⭐+' + SKIN_DATA[skinName].rating);
            updateUI();
        }

        function showPacks() {
            let msg = '📦 ПАКИ (💎 ' + playerCrystals + ')\n';
            msg += '🟤 Обычный - 100💎 (Нажми 1)\n';
            msg += '🔵 Редкий - 300💎 (Нажми 2)\n';
            msg += '🟣 Эпический - 800💎 (Нажми 3)\n';
            msg += '🟠 Легендарный - 2000💎 (Нажми 4)\n\n';
            msg += '👕 Твои скины:\n';
            for (let slot = 1; slot <= 5; slot++) {
                const name = equippedSkins[slot] || 'Пусто';
                const rating = SKIN_DATA[name] ? SKIN_DATA[name].rating : 0;
                msg += 'Слот ' + slot + ': ' + name + ' (⭐+' + rating + ')\n';
            }
            msg += '\n⭐ Рейтинг: ' + playerRating + '/99';
            showMessage(msg);
        }

        function equipSkin(skinName) {
            if (!ownedSkins[skinName]) {
                showMessage('❌ У вас нет этого скина!');
                return;
            }
            const slot = SKIN_DATA[skinName].slot;
            equippedSkins[slot] = skinName;
            saveGame();
            recalcRating();
            showMessage('✅ ' + skinName + ' надет!');
        }

        // ---- ИНИЦИАЛИЗАЦИЯ ----
        window.onload = function() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            loadSave();
            updateUI();
            setupMenuButtons();
            setupControls();
            setupKeyboardShortcuts();
            gameLoop();
        };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function updateUI() {
            const info = document.getElementById('playerInfo');
            if (playerName) {
                info.textContent = '👤 ' + playerName + ' | ⭐ ' + playerRating + ' | 💎 ' + playerCrystals;

            } else {

                document.getElementById('guestMenu').style.display = 'block';
                document.getElementById('userMenu').style.display = 'none';
            }

        }

        // ---- КНОПКИ МЕНЮ ----
        function setupMenuButtons() {
            const modeBtns = ['mode2x2', 'mode3x3'];
            modeBtns.forEach(id => {
                document.getElementById(id).onclick = function() {
                    modeBtns.forEach(b => document.getElementById(b).classList.remove('active'));

                document.getElementById(id).onclick = function() {

                    this.classList.add('active');
                    difficulty = id === 'diffEasy' ? 'easy' : id === 'diffMedium' ? 'medium' : 'hard';
                };
            });
        }

        // ---- ЗАПУСК ИГРЫ ----
        function startGame() {
            gameState = 'playing';
            document.getElementById('menu-container').style.display = 'none';
            document.getElementById('controls').style.display = 'flex';
            document.getElementById('score-display').style.display = 'block';
            document.getElementById('timer-display').style.display = 'block';
            document.getElementById('statusBar').style.display = 'block';
            document.getElementById('ratingDisplay').style.display = 'block';
            document.getElementById('statusBar').textContent = '⚽ Игра идет...';

            homeScore = 0;
            awayScore = 0;
            gameTime = 0;
            matchFinished = false;
            goalCooldown = 0;
            document.getElementById('score-display').textContent = '0 : 0';

            initMatch();
        }

        function initMatch() {
            ball = { x: 600, y: 350, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2 };
            players = [];
            goalkeepers = [];

            let homeTeam, awayTeam;
            if (mode === '2x2') {
                homeTeam = [
                    { name: 'Азиз', x: 250, y: 280, color: '#00b4d8' },
                    { name: 'Хабиб', x: 250, y: 420, color: '#0077b6' }
                ];
                awayTeam = [
                    { name: 'Шамиль Рб', x: 950, y: 280, color: '#e63946' },
                    { name: 'Шамиль Jr.', x: 950, y: 420, color: '#c1121f' }
                ];
            } else {
                homeTeam = [
                    { name: 'Азиз', x: 220, y: 240, color: '#00b4d8' },
                    { name: 'Хабиб', x: 220, y: 350, color: '#0077b6' },
                    { name: 'Абдул', x: 220, y: 460, color: '#2d6a4f' }
                ];
                awayTeam = [
                    { name: 'Шамиль Рб', x: 980, y: 240, color: '#e63946' },
                    { name: 'Шамиль Jr.', x: 980, y: 350, color: '#c1121f' },
                    { name: 'Салаудин', x: 980, y: 460, color: '#f77f00' }
                ];
            }

            let id = 0;
            homeTeam.forEach(p => {
                players.push({
                    ...p,
                    id: id++,
                    radius: PLAYER_RADIUS,
                    vx: 0,
                    vy: 0,
                    hasBall: false,
                    isPlayer: id === 1,
                    team: 'home',
                    role: 'field',
                    lastX: p.x,
                    lastY: p.y,
                    stuckTimer: 0,
                    passCooldown: 0
                });
            });
            awayTeam.forEach(p => {
                players.push({
                    ...p,
                    id: id++,
                    radius: PLAYER_RADIUS,
                    vx: 0,
                    vy: 0,
                    hasBall: false,
                    isPlayer: false,
                    team: 'away',
                    role: 'field',
                    lastX: p.x,
                    lastY: p.y,
                    stuckTimer: 0,
                    passCooldown: 0
                });
            });

            goalkeepers = [
                { x: 55, y: 350, radius: 25, team: 'home', name: 'Вратарь', lastY: 350 },
                { x: 1145, y: 350, radius: 25, team: 'away', name: 'Вратарь', lastY: 350 }
            ];

            players[0].hasBall = true;
        }

        // ---- ИГРОВОЙ ЦИКЛ ----
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (gameState !== 'playing' || matchFinished) return;

            // Таймер
            gameTime += 1 / 60;
            const remaining = Math.max(0, MATCH_TIME - gameTime);
            const mins = Math.floor(remaining / 60);
            const secs = Math.floor(remaining % 60);
            document.getElementById('timer-display').textContent = '⏱️ ' + mins + ':' + String(secs).padStart(2, '0');

            if (remaining <= 0 || homeScore >= 5 || awayScore >= 5) {
                endMatch();
                return;
            }

            // Мяч
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.vx *= 0.99;
            ball.vy *= 0.99;
            if (Math.abs(ball.vx) < 0.05) ball.vx = 0;
            if (Math.abs(ball.vy) < 0.05) ball.vy = 0;

            const margin = 40;
            if (ball.x < margin + BALL_RADIUS) { ball.x = margin + BALL_RADIUS;
                ball.vx *= -0.5; }
            if (ball.x > FIELD_W - margin - BALL_RADIUS) { ball.x = FIELD_W - margin - BALL_RADIUS;
                ball.vx *= -0.5; }
            if (ball.y < margin + BALL_RADIUS) { ball.y = margin + BALL_RADIUS;
                ball.vy *= -0.5; }
            if (ball.y > FIELD_H - margin - BALL_RADIUS) { ball.y = FIELD_H - margin - BALL_RADIUS;
                ball.vy *= -0.5; }

            checkGoals();

            // Обновление игроков
            const diffSettings = {
                easy: { speed: 1.8, accuracy: 0.3, aggression: 0.2, reaction: 30 },
                medium: { speed: 2.5, accuracy: 0.6, aggression: 0.5, reaction: 20 },
                hard: { speed: 3.2, accuracy: 0.85, aggression: 0.8, reaction: 10 }
            };
            const diff = diffSettings[difficulty] || diffSettings.medium;

            players.forEach((p, i) => {
                if (p.isPlayer) {
                    // Управление
                    let dx = 0,
                        dy = 0;
                    if (keys.up) dy = -4.5;
                    if (keys.down) dy = 4.5;
                    if (keys.left) dx = -4.5;
                    if (keys.right) dx = 4.5;
                    if (dx && dy) { dx *= 0.707;
                        dy *= 0.707; }
                    p.x += dx;
                    p.y += dy;
                    p.x = Math.max(40, Math.min(FIELD_W - 40, p.x));
                    p.y = Math.max(40, Math.min(FIELD_H - 40, p.y));
                    if (p.hasBall) {
                        ball.x = p.x + 28;
                        ball.y = p.y;
                        ball.vx = 0;
                        ball.vy = 0;
                    }
                } else {
                    updateBot(p, diff);
                }
                if (p.passCooldown > 0) p.passCooldown--;
            });

            // Вратари
            goalkeepers.forEach(gk => {
                const targetX = gk.team === 'home' ? 60 : 1140;
                const targetY = 350 + (ball.y - 350) * 0.25 + (Math.random() - 0.5) * 10;
                gk.x += (targetX - gk.x) * 0.08;
                gk.y += (targetY - gk.y) * 0.08;
                gk.x = Math.max(gk.team === 'home' ? 25 : 1150 - 25, Math.min(gk.team === 'home' ? 100 : 1175, gk.x));
                gk.y = Math.max(260, Math.min(440, gk.y));

                if (Math.hypot(gk.x - ball.x, gk.y - ball.y) < gk.radius + BALL_RADIUS + 5) {
                    const distToGoal = gk.team === 'home' ? ball.x : FIELD_W - ball.x;
                    if (distToGoal < 200 && Math.abs(ball.vx) < 5) {
                        ball.vx *= -0.3;
                        ball.vy *= -0.3;
                        if (Math.abs(ball.vx) < 1.5) {
                            ball.vx = (gk.team === 'home' ? 1 : -1) * (2 + Math.random() * 3);
                            ball.vy = (Math.random() - 0.5) * 2;
                            // Выбиваем
                        }
                    }
                }
            });

            // Столкновения с мячом
            players.forEach(p => {
                if (!p.hasBall) {
                    const dist = Math.hypot(p.x - ball.x, p.y - ball.y);
                    if (dist < p.radius + BALL_RADIUS + 2) {
                        const ang = Math.atan2(ball.y - p.y, ball.x - p.x);
                        const power = 1.5 + Math.random() * 2;
                        ball.vx = power * Math.cos(ang);
                        ball.vy = power * Math.sin(ang);
                        players.forEach(p2 => p2.hasBall = false);
                        p.hasBall = true;
                        if (!p.isPlayer) {
                            setTimeout(() => botAction(p, diff), 300);
                        }
                    }
                }
            });

            if (goalCooldown > 0) goalCooldown--;
        }

        // ---- БОТЫ ----
        function updateBot(p, diff) {
            // Определяем роль
            const role = p.id % 3;
            const isHome = p.team === 'home';

            let targetX = 600,
                targetY = 350;

            if (p.hasBall) {
                // Бот с мячом - идет к воротам или пасует
                if (Math.random() < 0.03 * diff.accuracy && p.passCooldown === 0) {
                    botAction(p, diff);
                    return;
                }
                targetX = isHome ? FIELD_W - 120 : 120;
                targetY = 350 + (Math.random() - 0.5) * 80;

                // Если рядом защитник - пас
                const nearbyEnemy = players.some(p2 => p2.team !== p.team && Math.hypot(p.x - p2.x, p.y - p2.y) < 100);
                if (nearbyEnemy && Math.random() < 0.3 * diff.accuracy && p.passCooldown === 0) {
                    botAction(p, diff);
                    return;
                }
            } else {
                // Без мяча - позиционирование
                if (role === 0) { // Защитник
                    targetX = isHome ? 200 : 1000;
                    targetY = 350 + (p.id % 2 === 0 ? -60 : 60);
                } else if (role === 1) { // Полузащитник
                    targetX = isHome ? 400 : 800;
                    targetY = 350 + (p.id % 2 === 0 ? -80 : 80);
                } else { // Нападающий
                    targetX = isHome ? 1000 : 200;
                    targetY = 350 + (p.id % 2 === 0 ? -50 : 50);
                }

                // Если мяч рядом - бежим к нему
                const distToBall = Math.hypot(p.x - ball.x, p.y - ball.y);
                if (distToBall < 200 && !players.some(p2 => p2.team === p.team && p2.hasBall)) {
                    targetX = ball.x + (isHome ? 20 : -20);
                    targetY = ball.y;
                }

                // Отбор у противника
                players.forEach(p2 => {
                    if (p2.team !== p.team && p2.hasBall && Math.hypot(p.x - p2.x, p.y - p2.y) < 55) {
                        if (Math.random() < diff.aggression * 0.3) {
                            const ang = Math.atan2(p2.y - p.y, p2.x - p.x);
                            ball.vx = 3 * Math.cos(ang + (Math.random() - 0.5) * 0.5);
                            ball.vy = 3 * Math.sin(ang + (Math.random() - 0.5) * 0.5);
                            p2.hasBall = false;
                            p.hasBall = true;
                            if (!p.isPlayer) {
                                setTimeout(() => botAction(p, diff), 300);
                            }
                        }
                    }
                });
            }

            // Анти-застревание
            if (Math.abs(p.x - p.lastX) < 1 && Math.abs(p.y - p.lastY) < 1) {
                p.stuckTimer++;
                if (p.stuckTimer > 60) {
                    targetX += (Math.random() - 0.5) * 150;
                    targetY += (Math.random() - 0.5) * 150;
                    p.stuckTimer = 0;
                }
            } else {
                p.stuckTimer = 0;
            }
            p.lastX = p.x;
            p.lastY = p.y;

            const dx = targetX - p.x;
            const dy = targetY - p.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 5) {
                const speed = diff.speed * (0.85 + Math.random() * 0.3);
                p.x += (dx / dist) * speed;
                p.y += (dy / dist) * speed;
            }

            p.x = Math.max(45, Math.min(FIELD_W - 45, p.x));
            p.y = Math.max(45, Math.min(FIELD_H - 45, p.y));
        }

        function botAction(p, diff) {
            if (!p.hasBall || matchFinished || p.passCooldown > 0) return;

            const isHome = p.team === 'home';
            const r = Math.random();

            // Пас - 60%
            if (r < 0.6) {
                const teammates = players.filter(p2 => p2.team === p.team && p2.id !== p.id);
                if (teammates.length > 0) {
                    // Выбираем самого открытого
                    let best = null;
                    let bestScore = -999;
                    teammates.forEach(tm => {
                        const distToEnemy = Math.min(...players.filter(p2 => p2.team !== p.team)
                            .map(p2 => Math.hypot(tm.x - p2.x, tm.y - p2.y)));
                        const score = -Math.hypot(tm.x - p.x, tm.y - p.y) * 0.5 + distToEnemy * 0.3;
                        if (score > bestScore) { bestScore = score;
                            best = tm; }
                    });
                    if (best) {
                        const ang = Math.atan2(best.y - p.y, best.x - p.x);
                        const power = 2.5 + Math.random() * 3;
                        ball.vx = power * Math.cos(ang + (Math.random() - 0.5) * 0.15);
                        ball.vy = power * Math.sin(ang + (Math.random() - 0.5) * 0.15);
                        p.hasBall = false;
                        p.passCooldown = 15;
                        setTimeout(() => {
                            players.forEach(p2 => p2.hasBall = false);
                            best.hasBall = true;
                        }, 100);
                        return;
                    }
                }
            }

            // Удар - 25%
            if (r < 0.85) {
                const goalX = isHome ? FIELD_W - 50 : 50;
                const goalY = 350 + (Math.random() - 0.5) * 80;
                const ang = Math.atan2(goalY - p.y, goalX - p.x);
                const power = 3 + Math.random() * 4;
                ball.vx = power * Math.cos(ang + (Math.random() - 0.5) * 0.25);
                ball.vy = power * Math.sin(ang + (Math.random() - 0.5) * 0.25);
                p.hasBall = false;
                return;
            }

            // Дриблинг - 15%
            const goalX = isHome ? FIELD_W - 150 : 150;
            const goalY = 350 + (Math.random() - 0.5) * 50;
            const ang = Math.atan2(goalY - p.y, goalX - p.x);
            ball.vx = 2 * Math.cos(ang);
            ball.vy = 2 * Math.sin(ang);
            p.hasBall = false;
            setTimeout(() => {
                players.forEach(p2 => p2.hasBall = false);
                p.hasBall = true;
            }, 200);
        }

        // ---- ГОЛЫ ----
        function checkGoals() {
            if (goalCooldown > 0) return;

            // Левые ворота (home)
            if (ball.x < 35 && ball.y > 350 - GOAL_HEIGHT / 2 && ball.y < 350 + GOAL_HEIGHT / 2) {
                if (ball.vx < -0.5) {
                    awayScore++;
                    goalCooldown = 60;
                    document.getElementById('score-display').textContent = homeScore + ' : ' + awayScore;
                    showMessage('⚽ ГОЛ! Команда Б забила!');
                    if (awayScore >= 5) endMatch('Поражение');
                    else resetBall();
                }
            }
            // Правые ворота (away)
            if (ball.x > FIELD_W - 35 && ball.y > 350 - GOAL_HEIGHT / 2 && ball.y < 350 + GOAL_HEIGHT / 2) {
                if (ball.vx > 0.5) {
                    homeScore++;
                    goalCooldown = 60;
                    document.getElementById('score-display').textContent = homeScore + ' : ' + awayScore;
                    showMessage('⚽ ГОЛ! Команда А забила!');
                    if (homeScore >= 5) endMatch('Победа');
                    else resetBall();
                }
            }
        }

        function resetBall() {
            ball.x = 600;
            ball.y = 350;
            ball.vx = (Math.random() - 0.5) * 2;
            ball.vy = (Math.random() - 0.5) * 2;
            players.forEach(p => p.hasBall = false);
            players[0].hasBall = true;
        }

        // ---- ЗАВЕРШЕНИЕ МАТЧА ----
        function endMatch() {
            if (matchFinished) return;
            matchFinished = true;
            const isWin = homeScore > awayScore;

            if (playerName) {
                playerMatches++;
                const diffBonus = difficulty === 'easy' ? 1 : difficulty === 'medium' ? 1.5 : 2;
                if (isWin) {
                    playerWins++;
                    const crystalsEarned = Math.floor(50 * diffBonus) + homeScore * 5 + (awayScore === 0 ? 30 : 0);
                    playerCrystals += crystalsEarned;
                    if (homeScore >= 3) playerCrystals += 25;
                    showMessage('🏆 ПОБЕДА! +' + crystalsEarned + '💎');
                } else {
                    playerCrystals += 10;
                    showMessage('💔 ПОРАЖЕНИЕ +10💎');
                }
                playerGoals += homeScore;
                saveGame();
                updateUI();
            }

            const msg = isWin ? '🏆 ПОБЕДА! ' + homeScore + ':' + awayScore : '💔 ПОРАЖЕНИЕ ' + homeScore + ':' + awayScore;
            document.getElementById('statusBar').textContent = '🏁 ' + (isWin ? 'Победа!' : 'Поражение');

            setTimeout(() => {
                gameState = 'menu';
                document.getElementById('menu-container').style.display = 'block';
                document.getElementById('controls').style.display = 'none';
                document.getElementById('score-display').style.display = 'none';
                document.getElementById('timer-display').style.display = 'none';
                document.getElementById('statusBar').style.display = 'none';
                updateUI();
            }, 2500);
        }

        // ---- УПРАВЛЕНИЕ ----
        function setupControls() {
            const dpadBtns = {
                'dpad-up': 'up',
                'dpad-down': 'down',
                'dpad-left': 'left',
                'dpad-right': 'right'
            };
            Object.keys(dpadBtns).forEach(id => {
                const key = dpadBtns[id];
                const el = document.getElementById(id);
                ['touchstart', 'mousedown'].forEach(ev => {
                    el.addEventListener(ev, e => { e.preventDefault();
                        keys[key] = true; });
                });
                ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(ev => {
                    el.addEventListener(ev, e => { e.preventDefault();
                        keys[key] = false; });
                });
            });

            document.getElementById('btn-shoot').addEventListener('touchstart', e => { e.preventDefault();
                handleShoot(); });
            document.getElementById('btn-shoot').addEventListener('mousedown', handleShoot);
            document.getElementById('btn-pass').addEventListener('touchstart', e => { e.preventDefault();
                handlePass(); });
            document.getElementById('btn-pass').addEventListener('mousedown', handlePass);
            document.getElementById('btn-tackle').addEventListener('touchstart', e => { e.preventDefault();
                handleTackle(); });
            document.getElementById('btn-tackle').addEventListener('mousedown', handleTackle);
        }

        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                if (gameState === 'playing') {
                    if (e.key === 'w' || e.key === 'ArrowUp') keys.up = true;
                    if (e.key === 's' || e.key === 'ArrowDown') keys.down = true;
                    if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
                    if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
                    if (e.key === ' ') { e.preventDefault();
                        handleShoot(); }
                    if (e.key === 'e') handlePass();
                    if (e.key === 'q') handleTackle();
                }
                if (gameState === 'menu' && playerName) {
                    if (e.key === '1') openPack('common');
                    if (e.key === '2') openPack('rare');
                    if (e.key === '3') openPack('epic');
                    if (e.key === '4') openPack('legendary');
                }
            });
            document.addEventListener('keyup', (e) => {
                if (e.key === 'w' || e.key === 'ArrowUp') keys.up = false;
                if (e.key === 's' || e.key === 'ArrowDown') keys.down = false;
                if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
                if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
            });
        }

        function handleShoot() {
            const p = players.find(p => p.isPlayer);
            if (!p || !p.hasBall || matchFinished) return;
            const isHome = p.team === 'home';
            const goalX = isHome ? FIELD_W - 50 : 50;
            const goalY = 350 + (Math.random() - 0.5) * 80;
            const ang = Math.atan2(goalY - p.y, goalX - p.x);
            const power = 4 + Math.random() * 4;
            ball.vx = power * Math.cos(ang + (Math.random() - 0.5) * 0.3);
            ball.vy = power * Math.sin(ang + (Math.random() - 0.5) * 0.3);
            p.hasBall = false;
        }

        function handlePass() {
            const p = players.find(p => p.isPlayer);
            if (!p || !p.hasBall || matchFinished) return;
            const teammates = players.filter(p2 => p2.team === p.team && p2.id !== p.id);
            if (teammates.length > 0) {
                let best = null;
                let bestScore = -999;
                teammates.forEach(tm => {
                    const score = -Math.hypot(tm.x - p.x, tm.y - p.y);
                    if (score > bestScore) { bestScore = score;
                        best = tm; }
                });
                if (best) {
                    const ang = Math.atan2(best.y - p.y, best.x - p.x);
                    const power = 2.5 + Math.random() * 3;
                    ball.vx = power * Math.cos(ang + (Math.random() - 0.5) * 0.15);
                    ball.vy = power * Math.sin(ang + (Math.random() - 0.5) * 0.15);
                    p.hasBall = false;
                    setTimeout(() => {
                        players.forEach(p2 => p2.hasBall = false);
                        best.hasBall = true;
                    }, 100);
                }
            }
        }

        function handleTackle() {
            const p = players.find(p => p.isPlayer);
            if (!p || matchFinished) return;
            players.forEach(p2 => {
                if (p2.team !== p.team && p2.hasBall && Math.hypot(p.x - p2.x, p.y - p2.y) < 55) {
                    const ang = Math.atan2(p2.y - p.y, p2.x - p.x);
                    ball.vx = 3 * Math.cos(ang + (Math.random() - 0.5) * 0.5);
                    ball.vy = 3 * Math.sin(ang + (Math.random() - 0.5) * 0.5);
                    p2.hasBall = false;
                    p.hasBall = true;
                }
            });
        }

        // ---- ОТРИСОВКА ----
        function render() {
            const w = canvas.width,
                h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            const scale = Math.min(w / FIELD_W, h / FIELD_H);
            const ox = (w - FIELD_W * scale) / 2;
            const oy = (h - FIELD_H * scale) / 2;

            ctx.save();
            ctx.translate(ox, oy);
            ctx.scale(scale, scale);

            // Поле
            ctx.fillStyle = '#1b4332';
            ctx.fillRect(0, 0, FIELD_W, FIELD_H);

            // Разметка
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 2;
            ctx.strokeRect(40, 40, FIELD_W - 80, FIELD_H - 80);
            ctx.beginPath();
            ctx.arc(FIELD_W / 2, FIELD_H / 2, 80, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(FIELD_W / 2, 40);
            ctx.lineTo(FIELD_W / 2, FIELD_H - 40);
            ctx.stroke();

            ctx.strokeRect(40, FIELD_H / 2 - 100, 120, 200);
            ctx.strokeRect(FIELD_W - 160, FIELD_H / 2 - 100, 120, 200);
            ctx.strokeRect(40, FIELD_H / 2 - 60, 60, 120);
            ctx.strokeRect(FIELD_W - 100, FIELD_H / 2 - 60, 60, 120);

            // Ворота
            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.fillRect(30, FIELD_H / 2 - GOAL_HEIGHT / 2, GOAL_WIDTH, GOAL_HEIGHT);
            ctx.fillRect(FIELD_W - 30 - GOAL_WIDTH, FIELD_H / 2 - GOAL_HEIGHT / 2, GOAL_WIDTH, GOAL_HEIGHT);
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 3;
            ctx.strokeRect(30, FIELD_H / 2 - GOAL_HEIGHT / 2, GOAL_WIDTH, GOAL_HEIGHT);
            ctx.strokeRect(FIELD_W - 30 - GOAL_WIDTH, FIELD_H / 2 - GOAL_HEIGHT / 2, GOAL_WIDTH, GOAL_HEIGHT);

            // Мяч
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Вратари
            goalkeepers.forEach(gk => {
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(gk.x, gk.y, gk.radius, 0, Math.PI * 2);
                ctx.fillStyle = gk.team === 'home' ? '#0055aa' : '#aa2200';
                ctx.fill();
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🧤', gk.x, gk.y - gk.radius - 5);
            });

            // Игроки
            players.forEach(p => {
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                if (p.isPlayer) {
                    const grad = ctx.createRadialGradient(p.x - 5, p.y - 5, 2, p.x, p.y, p.radius);
                    grad.addColorStop(0, '#ffd700');
                    grad.addColorStop(1, '#e6a800');
                    ctx.fillStyle = grad;
                } else {
                    ctx.fillStyle = p.color;
                }
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'white';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, p.x, p.y - p.radius - 8);

                if (p.hasBall) {
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (p.isPlayer) {
                    ctx.shadowColor = '#ffd700';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius + 4, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255,215,0,0.4)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    // Индикатор управления
                    ctx.fillStyle = 'rgba(255,215,0,0.6)';
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y - p.radius - 18);
                    ctx.lineTo(p.x - 6, p.y - p.radius - 10);
                    ctx.lineTo(p.x + 6, p.y - p.radius - 10);
                    ctx.fill();
                }
            });

            ctx.restore();

            if (gameState === 'playing') {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(w / 2 - 55, 8, 110, 34);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 22px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(homeScore + ' : ' + awayScore, w / 2, 34);
            }
        }

        // ---- СООБЩЕНИЯ ----
        function showMessage(text) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 2500);
        }

        // ---- ЛОГИН / РЕГИСТРАЦИЯ ----
        function showLogin() {
            document.getElementById('login-container').style.display = 'block';
            document.getElementById('loginTitle').textContent = '🔑 Вход';
            document.getElementById('loginMsg').textContent = '';
            document.getElementById('loginMsg').className = '';
            document.getElementById('loginName').value = '';
            document.getElementById('loginPass').value = '';
        }

        function showRegister() {
            document.getElementById('login-container').style.display = 'block';
            document.getElementById('loginTitle').textContent = '📝 Регистрация';
            document.getElementById('loginMsg').textContent = '';
            document.getElementById('loginMsg').className = '';
            document.getElementById('loginName').value = '';
            document.getElementById('loginPass').value = '';
        }

        function closeLogin() {
            document.getElementById('login-container').style.display = 'none';
        }

        function handleLogin() {
            const name = document.getElementById('loginName').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const msg = document.getElementById('loginMsg');

            if (!name || !pass) { msg.textContent = '❌ Заполните все поля!';
                msg.className = 'login-error'; return; }

            const users = JSON.parse(localStorage.getItem('football_users') || '{}');
            const title = document.getElementById('loginTitle').textContent;
            const isRegister = title.includes('Регистрация');

            if (isRegister) {
                if (users[name]) { msg.textContent = '❌ Игрок уже существует!';
                    msg.className = 'login-error'; return; }
                users[name] = { password: pass, rating: 50, crystals: 100, wins: 0, matches: 0, goals: 0,
                    equippedSkins: { 1: 'Повязка', 2: 'Майка', 3: 'Шорты', 4: 'Кеды', 5: 'Нарукавник' },
                    ownedSkins: {} };
                localStorage.setItem('football_users', JSON.stringify(users));
                msg.textContent = '✅ Регистрация успешна!';
                msg.className = 'login-success';
            } else {
                if (!users[name]) { msg.textContent = '❌ Игрок не найден!';
                    msg.className = 'login-error'; return; }
                if (users[name].password !== pass) { msg.textContent = '❌ Неверный пароль!';
                    msg.className = 'login-error'; return; }
                msg.textContent = '✅ Вход выполнен!';
                msg.className = 'login-success';
            }

            const userData = users[name];
            playerName = name;
            playerRating = userData.rating || 50;
            playerCrystals = userData.crystals || 100;
            playerWins = userData.wins || 0;
            playerMatches = userData.matches || 0;
            playerGoals = userData.goals || 0;
            equippedSkins = userData.equippedSkins || { 1: 'Повязка', 2: 'Майка', 3: 'Шорты', 4: 'Кеды', 5: 'Нарукавник' };
            ownedSkins = userData.ownedSkins || {};
            recalcRating();
            saveGame();
            updateUI();

            setTimeout(() => {
                closeLogin();
                document.getElementById('loginMsg').textContent = '';
            }, 800);
        }

        // ---- ТАБЛИЦА РЕЙТИНГОВ ----
        function showLeaderboard() {
            const users = JSON.parse(localStorage.getItem('football_users') || '{}');
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';

            const sorted = Object.entries(users)
                .map(([name, data]) => ({
                    name,
                    rating: data.rating || 50,
                    wins: data.wins || 0,
                    goals: data.goals || 0
                }))
                .sort((a, b) => b.rating - a.rating);

            if (sorted.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:20px;">Нет игроков</div>';
            } else {
                sorted.forEach((p, i) => {
                    const div = document.createElement('div');
                    div.className = 'entry';
                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
                    div.innerHTML = `
                        <span class="rank">${medal}</span>
                        <span class="name">${p.name}</span>
                        <span class="rating">⭐ ${p.rating}</span>
                        <span class="wins">🏆 ${p.wins}</span>
                    `;
                    list.appendChild(div);
                });
            }

            document.getElementById('leaderboard').style.display = 'block';
        }

        function closeLeaderboard() {
            document.getElementById('leaderboard').style.display = 'none';
        }

        // ---- ОНЛАЙН (заглушка) ----
        function showOnlineMenu() {
            showMessage('🌐 Онлайн режим в разработке!\nБудут: 1x1, 2x2 матчи с игроками');
        }

        // ---- СТАРТ ----
        console.log('⚽ STREET FOOTBALL LEGENDS загружена!');
        console.log('👤 Игрок:', playerName || 'Гость');
        console.log('⭐ Рейтинг:', playerRating);
        console.log('💎 Кристаллы:', playerCrystals);
        console.log('🎮 Управление: WASD/Стрелки - движение, SPACE - удар, E - пас, Q - отбор');
        console.log('📦 Паки: 1-Обычный, 2-Редкий, 3-Эпический, 4-Легендарный');
    </script>
