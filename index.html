<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ STREET FOOTBALL - ОНЛАЙН</title>
    <style>
        /* ===== ВЕСЬ СТИЛЬ ТОТ ЖЕ, ЧТО В ПРЕДЫДУЩЕЙ ВЕРСИИ ===== */
        /* (возьми из предыдущего сообщения) */
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <!-- ===== ВЕСЬ HTML ТОТ ЖЕ ===== -->
    <!-- (возьми из предыдущего сообщения) -->

    <script>
        // ============================================================
        // ==================== КЛИЕНТ (ИСПРАВЛЕННЫЙ) =================
        // ============================================================

        const SERVER_URL = 'https://machcup-mobile-server.onrender.com';

        let canvas, ctx;
        let gameState = 'menu';
        let mode = '2x2';
        let playerName = '';
        let playerRating = 50;
        let playerCrystals = 100;
        let lobbyMode = '1x1';

        // ---- ОНЛАЙН ----
        let currentLobby = null;
        let isInLobby = false;
        let isHost = false;
        let isOnline = false;
        let opponentName = '';
        let matchId = null;
        let matchState = null;
        let isMatchSubscribed = false;
        let keys = { up: false, down: false, left: false, right: false };
        let localPlayers = {};
        let localBall = { x: 600, y: 350 };
        let homeScore = 0,
            awayScore = 0;
        let gameTime = 0;
        let matchFinished = false;
        let syncInterval = null;
        let lastActionTime = 0;

        // ============================================================
        // ==================== API ====================================
        // ============================================================

        async function apiCall(endpoint, data) {
            try {
                const res = await fetch(SERVER_URL + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return await res.json();
            } catch (e) {
                return { error: 'Ошибка соединения' };
            }
        }

        async function apiGet(endpoint) {
            try {
                const res = await fetch(SERVER_URL + endpoint);
                return await res.json();
            } catch (e) {
                return { error: 'Ошибка соединения' };
            }
        }

        // ============================================================
        // ==================== WEBSOCKET =============================
        // ============================================================

        let socket = null;

        function initSocket() {
            try {
                const wsUrl = SERVER_URL.replace('https://', 'wss://').replace('http://', 'ws://');
                socket = new WebSocket(wsUrl + '/socket.io/?EIO=4&transport=websocket');
                socket.onopen = function() {
                    console.log('🔌 WebSocket подключен');
                    if (currentLobby && isInLobby) subscribeLobby(currentLobby);
                    if (matchId) subscribeMatch(matchId);
                };
                socket.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'lobby_update') {
                            handleLobbyUpdate(data);
                        } else if (data.type === 'match_update') {
                            handleMatchUpdate(data);
                        }
                    } catch (e) {}
                };
                socket.onclose = function() { setTimeout(initSocket, 3000); };
            } catch (e) {}
        }

        function subscribeLobby(lobbyId) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'subscribe', lobby_id: lobbyId }));
            }
        }

        function subscribeMatch(matchId) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'subscribe_match', match_id: matchId }));
                isMatchSubscribed = true;
            }
        }

        function handleLobbyUpdate(data) {
            if (currentLobby === data.lobby_id && isInLobby) updateLobbyUI();
        }

        function handleMatchUpdate(data) {
            if (matchId === data.match_id) {
                matchState = data.state;
                if (gameState === 'playing') updateGameFromState(data.state);
            }
        }

        // ============================================================
        // ==================== СОХРАНЕНИЕ ============================
        // ============================================================

        function loadSave() {
            try {
                const data = localStorage.getItem('football_save');
                if (data) {
                    const save = JSON.parse(data);
                    playerName = save.name || '';
                    playerRating = save.rating || 50;
                    playerCrystals = save.crystals || 100;
                }
            } catch (e) {}
        }

        function saveGame() {
            localStorage.setItem('football_save', JSON.stringify({
                name: playerName,
                rating: playerRating,
                crystals: playerCrystals
            }));
        }

        function updateUI() {
            const info = document.getElementById('playerInfo');
            if (playerName) {
                info.textContent = '👤 ' + playerName + ' | ⭐ ' + playerRating + ' | 💎 ' + playerCrystals;
                document.getElementById('guestMenu').style.display = 'none';
            } else {
                info.textContent = '👤 Гость | ⭐ 50 | 💎 100';
                document.getElementById('guestMenu').style.display = 'block';
            }
            document.getElementById('ratingDisplay').textContent = '⭐ ' + playerRating;
        }

        // ============================================================
        // ==================== UI =====================================
        // ============================================================

        function showOnlineUI() {
            if (!playerName) { showMessage('❌ Сначала войдите!'); return; }
            document.getElementById('online-overlay').style.display = 'flex';
        }

        function closeOnlineUI() {
            document.getElementById('online-overlay').style.display = 'none';
        }

        function showCreateLobbyUI() {
            closeOnlineUI();
            document.getElementById('create-lobby-overlay').style.display = 'flex';
            document.getElementById('lobbyNameInput').value = 'Лобби ' + playerName;
            document.querySelectorAll('#create-lobby-container .mode-select .btn').forEach(b => b.classList.remove('active'));
            document.querySelector('#create-lobby-container .mode-select .btn:first-child').classList.add('active');
            lobbyMode = '1x1';
        }

        function closeCreateLobbyUI() {
            document.getElementById('create-lobby-overlay').style.display = 'none';
            showOnlineUI();
        }

        function selectLobbyMode(mode, btn) {
            document.querySelectorAll('#create-lobby-container .mode-select .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            lobbyMode = mode;
        }

        function showFindLobbyUI() {
            closeOnlineUI();
            document.getElementById('find-lobby-overlay').style.display = 'flex';
            findLobbies();
        }

        function closeFindLobbyUI() {
            document.getElementById('find-lobby-overlay').style.display = 'none';
            showOnlineUI();
        }

        function showLobbyUI() {
            document.getElementById('lobby-overlay').style.display = 'flex';
            updateLobbyUI();
        }

        function closeLobbyUI() {
            document.getElementById('lobby-overlay').style.display = 'none';
        }

        // ============================================================
        // ==================== ЛОГИН =================================
        // ============================================================

        function showLogin() {
            document.getElementById('login-container').style.display = 'block';
            document.getElementById('loginTitle').textContent = '🔑 Вход';
            document.getElementById('loginMsg').textContent = '';
            document.getElementById('loginMsg').className = '';
            document.getElementById('loginName').value = '';
            document.getElementById('loginPass').value = '';
        }

        function showRegister() {
            document.getElementById('login-container').style.display = 'block';
            document.getElementById('loginTitle').textContent = '📝 Регистрация';
            document.getElementById('loginMsg').textContent = '';
            document.getElementById('loginMsg').className = '';
            document.getElementById('loginName').value = '';
            document.getElementById('loginPass').value = '';
        }

        function closeLogin() {
            document.getElementById('login-container').style.display = 'none';
        }

        async function handleLogin() {
            const name = document.getElementById('loginName').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const msg = document.getElementById('loginMsg');

            if (!name || !pass) {
                msg.textContent = '❌ Заполните все поля!';
                msg.className = 'login-error';
                return;
            }

            const isRegister = document.getElementById('loginTitle').textContent.includes('Регистрация');
            const result = await apiCall(isRegister ? '/api/register' : '/api/login', { name, password: pass });

            if (result.error) {
                msg.textContent = '❌ ' + result.error;
                msg.className = 'login-error';
                return;
            }

            msg.textContent = '✅ Успешно!';
            msg.className = 'login-success';

            playerName = name;
            if (result.player) {
                playerRating = result.player.rating || 50;
                playerCrystals = result.player.crystals || 100;
            }
            saveGame();
            updateUI();

            setTimeout(() => {
                closeLogin();
                document.getElementById('loginMsg').textContent = '';
                document.getElementById('loginMsg').className = '';
                showMessage('👋 Добро пожаловать, ' + playerName + '!');
            }, 1000);
        }

        // ============================================================
        // ==================== ЛОББИ =================================
        // ============================================================

        async function createLobby() {
            const lobbyName = document.getElementById('lobbyNameInput').value.trim() || 'Лобби ' + playerName;
            if (!playerName) { showMessage('❌ Войдите в аккаунт!'); return; }

            const result = await apiCall('/api/lobby/create', {
                name: lobbyName,
                host: playerName,
                mode: lobbyMode
            });

            if (result.error) {
                showMessage('❌ ' + result.error);
                return;
            }

            currentLobby = result.lobby_id;
            isInLobby = true;
            isHost = true;

            closeCreateLobbyUI();
            showLobbyUI();
            showMessage('✅ Лобби "' + lobbyName + '" создано!');
            subscribeLobby(currentLobby);
            updateLobbyUI();
            startLobbySync();
        }

        async function findLobbies() {
            const list = document.getElementById('lobby-list');
            if (!list) return;

            const result = await apiGet('/api/lobby/list');

            if (result.error || result.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:20px;">Нет доступных лобби</div>';
                return;
            }

            let html = '';
            result.forEach(lobby => {
                const isFull = lobby.players.length >= 2;
                html += `
                    <div class="lobby-item">
                        <div class="lobby-info-text">
                            <div class="lobby-name">${lobby.name}</div>
                            <div class="lobby-desc">👤 ${lobby.host} | ${lobby.mode} | ${lobby.players.length}/2</div>
                        </div>
                        ${!isFull && lobby.host !== playerName ? 
                            `<button class="join-btn" onclick="joinLobby('${lobby.id}')">🔗 Присоединиться</button>` : 
                            `<span style="color:rgba(255,255,255,0.2);">${isFull ? '🟢 Полно' : '❌ Ваше'}</span>`
                        }
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        async function joinLobby(lobbyId) {
            const result = await apiCall('/api/lobby/join', {
                lobby_id: lobbyId,
                player: playerName
            });

            if (result.error) {
                showMessage('❌ ' + result.error);
                return;
            }

            currentLobby = lobbyId;
            isInLobby = true;
            isHost = false;

            closeFindLobbyUI();
            showLobbyUI();
            showMessage('✅ Вы присоединились!');
            subscribeLobby(currentLobby);
            updateLobbyUI();
            startLobbySync();
        }

        function startLobbySync() {
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(async () => {
                if (!currentLobby || !isInLobby) {
                    clearInterval(syncInterval);
                    syncInterval = null;
                    return;
                }
                const result = await apiGet('/api/lobby/get/' + currentLobby);
                if (result.error) {
                    closeLobbyUI();
                    showMessage('❌ Лобби удалено');
                    if (syncInterval) { clearInterval(syncInterval);
                        syncInterval = null; }
                    return;
                }
                updateLobbyUI();
            }, 2000);
        }

        async function leaveLobby() {
            if (!currentLobby) return;
            if (syncInterval) { clearInterval(syncInterval);
                syncInterval = null; }

            await apiCall('/api/lobby/leave', {
                lobby_id: currentLobby,
                player: playerName
            });

            currentLobby = null;
            isInLobby = false;
            isHost = false;

            closeLobbyUI();
            showOnlineUI();
            showMessage('🚪 Вы вышли из лобби');
        }

        async function updateLobbyUI() {
            if (!currentLobby) return;

            const result = await apiGet('/api/lobby/get/' + currentLobby);
            if (result.error) {
                closeLobbyUI();
                showMessage('❌ Лобби удалено');
                if (syncInterval) { clearInterval(syncInterval);
                    syncInterval = null; }
                return;
            }

            const lobby = result;

            document.getElementById('lobby-title').textContent = '🏠 ' + lobby.name;
            document.getElementById('lobby-info').textContent = '📊 ' + lobby.mode;

            let playersHtml = '';
            lobby.players.forEach(p => {
                const isHostPlayer = p === lobby.host;
                const isMe = p === playerName;
                playersHtml += `
                    <div class="lobby-player" style="${isMe ? 'border-left: 3px solid #ffd700;' : ''}">
                        <span>${p} ${isHostPlayer ? '👑' : ''} ${isMe ? ' (Вы)' : ''}</span>
                        <span class="${isHostPlayer ? 'host-badge' : 'ready-badge'}">
                            ${isHostPlayer ? 'Хост' : '✅ Готов'}
                        </span>
                    </div>
                `;
            });

            const emptySlots = 2 - lobby.players.length;
            for (let i = 0; i < emptySlots; i++) {
                playersHtml += `
                    <div class="lobby-player">
                        <span style="color:rgba(255,255,255,0.2);">🔲 Свободно</span>
                        <span class="waiting-badge">Ожидание...</span>
                    </div>
                `;
            }
            document.getElementById('lobby-players-list').innerHTML = playersHtml;

            const statusText = document.getElementById('lobby-status-text');
            const startBtn = document.getElementById('lobby-start-btn');

            if (lobby.status === 'playing') {
                statusText.textContent = '⚽ Матч идёт...';
                startBtn.style.display = 'none';
            } else if (lobby.players.length >= 2) {
                statusText.textContent = '✅ Все готовы!';
                if (isHost) {
                    startBtn.style.display = 'block';
                    startBtn.textContent = '▶️ НАЧАТЬ МАТЧ';
                } else {
                    startBtn.style.display = 'none';
                    statusText.textContent = '⏳ Ожидание хоста...';
                }
            } else {
                statusText.textContent = '⏳ Ожидание игроков... (' + lobby.players.length + '/2)';
                startBtn.style.display = 'none';
            }
        }

        async function startOnlineMatch() {
            if (!currentLobby || !isHost) {
                showMessage('❌ Только хост может начать!');
                return;
            }

            const result = await apiCall('/api/lobby/start', {
                lobby_id: currentLobby
            });

            if (result.error) {
                showMessage('❌ ' + result.error);
                return;
            }

            const lobby = result.lobby;
            opponentName = lobby.players.find(p => p !== playerName) || 'Соперник';
            matchId = result.match_id;

            if (syncInterval) { clearInterval(syncInterval);
                syncInterval = null; }

            closeLobbyUI();
            showMessage('⚽ Матч начинается! Противник: ' + opponentName);
            isOnline = true;

            subscribeMatch(matchId);

            setTimeout(() => { startGame('online'); }, 500);
        }

        // ============================================================
        // ==================== ВЫХОД ИЗ МАТЧА ========================
        // ============================================================

        async function leaveMatch() {
            if (!matchId) return;

            await apiCall('/api/match/leave', {
                match_id: matchId,
                player: playerName
            });

            matchId = null;
            isOnline = false;
            matchFinished = true;

            gameState = 'menu';
            document.getElementById('menu-container').style.display = 'block';
            document.getElementById('joystick-area').style.display = 'none';
            document.getElementById('action-buttons').style.display = 'none';
            document.getElementById('score-display').style.display = 'none';
            document.getElementById('timer-display').style.display = 'none';
            document.getElementById('statusBar').style.display = 'none';
            document.getElementById('online-status').style.display = 'none';
            updateUI();
            showMessage('🚪 Вы вышли из матча');
        }

        // ============================================================
        // ==================== ИГРОВОЙ ДВИЖОК ========================
        // ============================================================

        window.onload = function() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            loadSave();
            updateUI();
            initSocket();
            setupJoystick();
            setupActionButtons();
            setupKeyboard();
            gameLoop();
            console.log('🚀 Игра загружена!');
        };

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // ---- ДЖОСТИК ----
        function setupJoystick() {
            const base = document.getElementById('joystick-base');
            const thumb = document.getElementById('joystick-thumb');
            const area = document.getElementById('joystick-area');

            let touchId = null;

            const handleMove = (cx, cy) => {
                const rect = base.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const maxDist = rect.width / 2 - 30;
                let dx = cx - centerX,
                    dy = cy - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > maxDist) { dx = dx / dist * maxDist;
                    dy = dy / dist * maxDist; }
                thumb.style.left = rect.width / 2 + dx - 27.5 + 'px';
                thumb.style.top = rect.height / 2 + dy - 27.5 + 'px';
                const dead = 0.15;
                const normX = dx / maxDist,
                    normY = dy / maxDist;
                keys.up = normY < -dead;
                keys.down = normY > dead;
                keys.left = normX < -dead;
                keys.right = normX > dead;
                sendAction('move', {
                    dx: keys.left ? -1 : keys.right ? 1 : 0,
                    dy: keys.up ? -1 : keys.down ? 1 : 0
                });
            };

            const handleEnd = () => {
                thumb.style.left = '50%';
                thumb.style.top = '50%';
                thumb.style.transform = 'translate(-50%, -50%)';
                keys.up = false;
                keys.down = false;
                keys.left = false;
                keys.right = false;
                sendAction('move', { dx: 0, dy: 0 });
            };

            area.addEventListener('touchstart', e => {
                e.preventDefault();
                touchId = e.changedTouches[0].identifier;
                handleMove(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }, { passive: false });
            area.addEventListener('touchmove', e => {
                e.preventDefault();
                for (let t of e.changedTouches) {
                    if (t.identifier === touchId) handleMove(t.clientX, t.clientY);
                }
            }, { passive: false });
            area.addEventListener('touchend', e => { for (let t of e.changedTouches) { if (t.identifier === touchId)
                        handleEnd(); } }, { passive: false });
            area.addEventListener('touchcancel', handleEnd, { passive: false });

            let mouseDown = false;
            area.addEventListener('mousedown', e => { mouseDown = true;
                handleMove(e.clientX, e.clientY); });
            document.addEventListener('mousemove', e => { if (mouseDown) handleMove(e.clientX, e.clientY); });
            document.addEventListener('mouseup', () => { if (mouseDown) { mouseDown = false;
                    handleEnd(); } });
        }

        // ---- КНОПКИ ----
        function setupActionButtons() {
            document.getElementById('btn-shoot').addEventListener('touchstart', e => { e.preventDefault();
                sendAction('shoot', { target_x: 1150, target_y: 350 }); });
            document.getElementById('btn-shoot').addEventListener('mousedown', () => sendAction('shoot', { target_x: 1150,
                target_y: 350 }));
            document.getElementById('btn-pass').addEventListener('touchstart', e => { e.preventDefault();
                sendAction('pass', {}); });
            document.getElementById('btn-pass').addEventListener('mousedown', () => sendAction('pass', {}));
            document.getElementById('btn-tackle').addEventListener('touchstart', e => { e.preventDefault();
                sendAction('tackle', {}); });
            document.getElementById('btn-tackle').addEventListener('mousedown', () => sendAction('tackle', {}));

            // Кнопка выхода из матча (добавляем динамически)
            const exitBtn = document.createElement('button');
            exitBtn.className = 'btn btn-red';
            exitBtn.textContent = '🚪 ВЫЙТИ ИЗ МАТЧА';
            exitBtn.style.position = 'absolute';
            exitBtn.style.bottom = '10px';
            exitBtn.style.left = '50%';
            exitBtn.style.transform = 'translateX(-50%)';
            exitBtn.style.width = '200px';
            exitBtn.style.zIndex = '50';
            exitBtn.style.display = 'none';
            exitBtn.id = 'exit-match-btn';
            exitBtn.onclick = leaveMatch;
            document.getElementById('ui-overlay').appendChild(exitBtn);
        }

        // ---- КЛАВИАТУРА ----
        function setupKeyboard() {
            document.addEventListener('keydown', e => {
                if (gameState === 'playing') {
                    if (e.key === 'w' || e.key === 'ArrowUp') { keys.up = true;
                        sendAction('move', { dx: keys.left ? -1 : keys.right ? 1 : 0, dy: -1 }); }
                    if (e.key === 's' || e.key === 'ArrowDown') { keys.down = true;
                        sendAction('move', { dx: keys.left ? -1 : keys.right ? 1 : 0, dy: 1 }); }
                    if (e.key === 'a' || e.key === 'ArrowLeft') { keys.left = true;
                        sendAction('move', { dx: -1, dy: keys.up ? -1 : keys.down ? 1 : 0 }); }
                    if (e.key === 'd' || e.key === 'ArrowRight') { keys.right = true;
                        sendAction('move', { dx: 1, dy: keys.up ? -1 : keys.down ? 1 : 0 }); }
                    if (e.key === ' ') { e.preventDefault();
                        sendAction('shoot', { target_x: 1150, target_y: 350 }); }
                    if (e.key === 'e') sendAction('pass', {});
                    if (e.key === 'q') sendAction('tackle', {});
                    if (e.key === 'Escape') leaveMatch();
                }
            });
            document.addEventListener('keyup', e => {
                if (e.key === 'w' || e.key === 'ArrowUp') { keys.up = false;
                    sendAction('move', { dx: keys.left ? -1 : keys.right ? 1 : 0, dy: 0 }); }
                if (e.key === 's' || e.key === 'ArrowDown') { keys.down = false;
                    sendAction('move', { dx: keys.left ? -1 : keys.right ? 1 : 0, dy: 0 }); }
                if (e.key === 'a' || e.key === 'ArrowLeft') { keys.left = false;
                    sendAction('move', { dx: 0, dy: keys.up ? -1 : keys.down ? 1 : 0 }); }
                if (e.key === 'd' || e.key === 'ArrowRight') { keys.right = false;
                    sendAction('move', { dx: 0, dy: keys.up ? -1 : keys.down ? 1 : 0 }); }
            });
        }

        // ---- ОТПРАВКА ДЕЙСТВИЙ ----
        function sendAction(type, data) {
            if (!matchId || gameState !== 'playing') return;
            const now = Date.now();
            if (now - lastActionTime < 50) return;
            lastActionTime = now;
            apiCall('/api/match/action', {
                match_id: matchId,
                player_name: playerName,
                action: { type, ...data }
            }).catch(() => {});
        }

        // ---- ОБНОВЛЕНИЕ ОТ СЕРВЕРА ----
        function updateGameFromState(state) {
            if (!state) return;

            if (state.score) {
                homeScore = state.score.home || 0;
                awayScore = state.score.away || 0;
                document.getElementById('score-display').textContent = homeScore + ' : ' + awayScore;
            }

            if (state.time !== undefined) {
                gameTime = state.time;
                const remaining = Math.max(0, 300 - gameTime);
                const mins = Math.floor(remaining / 60);
                const secs = Math.floor(remaining % 60);
                document.getElementById('timer-display').textContent = '⏱️ ' + mins + ':' + String(secs).padStart(2, '0');
            }

            if (state.players) {
                localPlayers = {};
                for (let name in state.players) {
                    const p = state.players[name];
                    localPlayers[name] = {
                        x: p.x || 0,
                        y: p.y || 0,
                        team: p.team || 'home',
                        hasBall: p.hasBall || false,
                        name: name,
                        isPlayer: name === playerName
                    };
                }
            }

            if (state.ball) {
                localBall = { x: state.ball.x || 600, y: state.ball.y || 350 };
            }

            if (state.status === 'finished') {
                endMatch();
            }
        }

        // ---- ЗАПУСК ИГРЫ ----
        function startGame(type) {
            isOnline = type === 'online';
            gameState = 'playing';
            document.getElementById('menu-container').style.display = 'none';
            document.getElementById('joystick-area').style.display = 'block';
            document.getElementById('action-buttons').style.display = 'flex';
            document.getElementById('score-display').style.display = 'block';
            document.getElementById('timer-display').style.display = 'block';
            document.getElementById('statusBar').style.display = 'block';
            document.getElementById('ratingDisplay').style.display = 'block';
            document.getElementById('exit-match-btn').style.display = 'block';

            if (isOnline) {
                document.getElementById('online-status').style.display = 'block';
                document.getElementById('online-status').textContent = '🌐 ' + opponentName;
                document.getElementById('statusBar').textContent = '⚽ Онлайн матч!';
            }

            homeScore = 0;
            awayScore = 0;
            gameTime = 0;
            matchFinished = false;
            document.getElementById('score-display').textContent = '0 : 0';

            if (isOnline && matchId) {
                apiGet('/api/match/state/' + matchId).then(r => {
                    if (!r.error) updateGameFromState(r);
                });
            }
        }

        // ---- ИГРОВОЙ ЦИКЛ ----
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (gameState !== 'playing' || matchFinished) return;
            if (isOnline && matchId) {
                apiGet('/api/match/state/' + matchId).then(r => {
                    if (!r.error) updateGameFromState(r);
                }).catch(() => {});
            }
        }

        function render() {
            if (!canvas || !ctx) return;
            const w = canvas.width,
                h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            const scale = Math.min(w / 1200, h / 700);
            const ox = (w - 1200 * scale) / 2;
            const oy = (h - 700 * scale) / 2;

            ctx.save();
            ctx.translate(ox, oy);
            ctx.scale(scale, scale);

            // Поле
            ctx.fillStyle = '#1b4332';
            ctx.fillRect(0, 0, 1200, 700);

            // Разметка
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 2;
            ctx.strokeRect(40, 40, 1120, 620);
            ctx.beginPath();
            ctx.arc(600, 350, 80, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(600, 40);
            ctx.lineTo(600, 660);
            ctx.stroke();
            ctx.strokeRect(40, 250, 120, 200);
            ctx.strokeRect(1040, 250, 120, 200);
            ctx.strokeRect(40, 290, 60, 120);
            ctx.strokeRect(1100, 290, 60, 120);

            // Ворота
            ctx.fillStyle = 'rgba(255,255,255,0.04)';
            ctx.fillRect(25, 260, 30, 180);
            ctx.fillRect(1145, 260, 30, 180);
            ctx.strokeStyle = 'rgba(255,255,255,0.25)';
            ctx.lineWidth = 3;
            ctx.strokeRect(25, 260, 30, 180);
            ctx.strokeRect(1145, 260, 30, 180);

            // Мяч
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(localBall.x || 600, localBall.y || 350, 10, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Игроки
            for (let name in localPlayers) {
                const p = localPlayers[name];
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 18, 0, Math.PI * 2);
                if (p.isPlayer) {
                    const grad = ctx.createRadialGradient(p.x - 5, p.y - 5, 3, p.x, p.y, 18);
                    grad.addColorStop(0, '#ffd700');
                    grad.addColorStop(1, '#e6a800');
                    ctx.fillStyle = grad;
                } else {
                    ctx.fillStyle = p.team === 'home' ? '#00b4d8' : '#e63946';
                }
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'white';
                ctx.font = 'bold 9px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(name, p.x, p.y - 28);

                if (p.hasBall) {
                    ctx.shadowColor = 'rgba(255,215,0,0.3)';
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                if (p.isPlayer) {
                    ctx.shadowColor = '#ffd700';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255,215,0,0.2)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }

            ctx.restore();

            if (gameState === 'playing') {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(w / 2 - 45, 6, 90, 28);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(homeScore + ' : ' + awayScore, w / 2, 27);
            }
        }

        // ---- ЗАВЕРШЕНИЕ МАТЧА ----
        function endMatch() {
            if (matchFinished) return;
            matchFinished = true;
            const isWin = homeScore > awayScore;

            if (playerName && isOnline) {
                if (isWin) {
                    playerCrystals += 30 + homeScore * 5;
                    showMessage('🏆 ПОБЕДА! +' + (30 + homeScore * 5) + '💎');
                } else {
                    playerCrystals += 10;
                    showMessage('💔 ПОРАЖЕНИЕ +10💎');
                }
                saveGame();
                updateUI();
            }

            document.getElementById('statusBar').textContent = '🏁 ' + (isWin ? 'Победа!' : 'Поражение');

            setTimeout(() => {
                document.getElementById('exit-match-btn').style.display = 'none';
                gameState = 'menu';
                document.getElementById('menu-container').style.display = 'block';
                document.getElementById('joystick-area').style.display = 'none';
                document.getElementById('action-buttons').style.display = 'none';
                document.getElementById('score-display').style.display = 'none';
                document.getElementById('timer-display').style.display = 'none';
                document.getElementById('statusBar').style.display = 'none';
                document.getElementById('online-status').style.display = 'none';
                isOnline = false;
                updateUI();
            }, 2500);
        }

        function showMessage(text) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 2500);
        }

        console.log('⚽ STREET FOOTBALL ONLINE v20.0 загружена!');
        console.log('🌐 Сервер:', SERVER_URL);
        console.log('👤 Игрок:', playerName || 'Гость');
    </script>
</body>
